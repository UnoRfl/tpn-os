// Two apps from one codebase (product flavors):
//   counter  TPN Counter — Floor & Counter on a bundled GeckoView, plus the
//            customer screen on the iMin's second display (system WebView)
//   kitchen  TPN Kitchen — the Kitchen station, same engine, no back screen Built by .github/workflows/build-apk.yml.
// Env (all optional): TPN_SITE_URL, TPN_VERSION_CODE, TPN_KEYSTORE,
// TPN_KEYSTORE_PASSWORD. Without a keystore the APK is debug-signed.
plugins { id 'com.android.application' }

def env = { String k, String d -> System.getenv(k) ?: d }
def site = env('TPN_SITE_URL', 'https://unorfl.github.io/tpn-os/')
if (!site.endsWith('/')) site += '/'
def ks = System.getenv('TPN_KEYSTORE')

android {
    namespace 'ph.tyopaengnyo.counter'
    compileSdk 36

    defaultConfig {
        applicationId 'ph.tyopaengnyo.counter'
        minSdk 26
        targetSdk 34
        versionCode env('TPN_VERSION_CODE', '1') as int
        versionName '1.4.' + env('TPN_VERSION_CODE', '1')
        buildConfigField 'String', 'SITE_URL', "\"${site}\""
        // ARM only (the iMin and every Android POS we'd use): keeps the bundled engine's size down.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildFeatures { buildConfig true }

    flavorDimensions 'station'
    productFlavors {
        counter {
            dimension 'station'
            applicationId 'ph.tyopaengnyo.counter'
            resValue 'string', 'app_name', 'TPN Counter'
            buildConfigField 'String', 'START_PATH', '"tpn-dine-in-floor"'
            buildConfigField 'boolean', 'CUSTOMER_SCREEN', 'true'
            buildConfigField 'String', 'UA_TAG', '"TPNCounter"'
        }
        kitchen {
            dimension 'station'
            applicationId 'ph.tyopaengnyo.kitchen'
            resValue 'string', 'app_name', 'TPN Kitchen'
            buildConfigField 'String', 'START_PATH', '"tpn-kitchen-station"'
            buildConfigField 'boolean', 'CUSTOMER_SCREEN', 'false'
            buildConfigField 'String', 'UA_TAG', '"TPNKitchen"'
        }
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('TPN_KEYSTORE_PASSWORD')
                keyAlias 'tpncounter'
                keyPassword System.getenv('TPN_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }
    // Compressed native libs: the bundled engine is ~3x smaller to download (slightly slower first start).
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pinned. 154+ need compileSdk 37 (androidx core 1.19), beyond AGP 8.9; move up with the toolchain.
    implementation 'org.mozilla.geckoview:geckoview:153.0.20260810162159'
}
