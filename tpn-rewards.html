<title>Stamp Card — Tyo Paeng Nyo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --brick:#8B1A0E; --ember:#C43D1A; --amber:#D4720A; --gold:#B8800F; --bg:#F2E4C7; --bg-2:#EDDCB8; --surface:#F7EDD3; --surface-2:#E8D4A8;
          --ink:#2B1810; --ink-soft:#4A2F1D; --ink-muted:#6B4A35; --ink-faint:#9C7F65; --line:rgba(139,26,14,.16); --line-soft:rgba(139,26,14,.08);
          --success:#5C8A3A; --warn:#C8881A; --danger:#B22A1A; --shadow:0 4px 16px rgba(74,47,29,.12); --shadow-sm:0 1px 2px rgba(74,47,29,.1); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1A1210; --bg-2:#221715; --surface:#251A17; --surface-2:#2F211D;
          --ink:#F5E7D0; --ink-soft:#DFCBAE; --ink-muted:#B49A7E; --ink-faint:#8A7159; --brick:#E8734F; --ember:#C6532F; --line:rgba(232,196,138,.16); --line-soft:rgba(232,196,138,.09); } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--bg); color: var(--ink-soft); min-height: 100vh; line-height: 1.5; }
  main { max-width: 460px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px 40px; position: relative; z-index: 2; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .logo { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 20px; color: var(--brick); text-decoration: none; }
  .logo span { color: var(--ink); }
  h1 { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--ink); line-height: 1.15; margin-bottom: 6px; }
  h1 em { color: var(--brick); }
  .lead { color: var(--ink-muted); margin-bottom: 18px; }
  .card { padding: 20px; border-radius: 22px; margin-bottom: 16px; }
  .stamps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 14px 0; }
  .stamp { aspect-ratio: 1; border-radius: 50%; border: 2px dashed var(--line); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--ink-faint); }
  .stamp.on { border: 2px solid var(--brick); background: color-mix(in srgb, var(--brick) 14%, transparent); color: var(--brick); }
  .count { font-size: 15px; color: var(--ink); } .count strong { font-size: 26px; color: var(--brick); }
  .reward { padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--gold) 16%, transparent); color: var(--ink); font-size: 14px; }
  .btn-row { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .btn-row .btn-next, .btn-row .btn-ghost { width: 100%; margin: 0; min-height: 52px; font-size: 16px; }
  .code-view { text-align: center; }
  .code-qr { width: 240px; height: 240px; margin: 12px auto; background: #fff; border-radius: 16px; padding: 10px; }
  .code-qr svg { width: 100%; height: 100%; }
  .code-num { font-size: 40px; letter-spacing: .25em; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
  .ring { height: 6px; border-radius: 3px; background: var(--line-soft); overflow: hidden; margin: 10px auto; max-width: 240px; }
  .ring > i { display: block; height: 100%; background: var(--brick); transition: width 1s linear; }
  .hist { list-style: none; } .hist li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
  .muted { color: var(--ink-muted); font-size: 13px; }
  .form-label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); margin: 10px 0 4px; }
  .form-input { width: 100%; padding: 14px; font: inherit; font-size: 16px; color: var(--ink); }
  .err { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 8px; }
  .btn-next, .btn-ghost { font: inherit; font-weight: 700; padding: 12px 22px; cursor: pointer; border: 0; color: #FFF8E8; }
  .btn-ghost { color: var(--ink); }
  a { color: var(--brick); }
</style>
<link rel="stylesheet" href="tpn-glass.css?v=20261022a">
</head>
<body>
<main id="app" aria-live="polite">
  <header><a class="logo" href="./">Tyo Paeng <span>Nyo</span></a><a href="./#faq" class="muted">How it works</a></header>
  <div id="view"><p class="muted">Loading your card…</p></div>
</main>
<script>
(function () {
  'use strict';
  const E = (v) => TPN.esc(v);
  const KEY = 'tpn.card.v1', CACHE = 'tpn.card.cache.v1';
  const view = document.getElementById('view');
  const get = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let codeTimer = null;

  function friendly(msg) {
    msg = String(msg || '');
    if (/proof_not_found/.test(msg)) return 'We could not match that order. Use the link on your receipt, or order with your phone number first.';
    if (/phone_does_not_match_order/.test(msg)) return 'That phone number is not the one on the order.';
    if (/bad_phone/.test(msg)) return 'Please enter a Philippine mobile number, like 0917 123 4567.';
    if (/card_not_on_this_device/.test(msg)) return 'This card was removed from this phone. Claim it again.';
    if (/too_many_requests/.test(msg)) return 'Too many tries. Please wait a few minutes.';
    if (/Failed to fetch|NetworkError/i.test(msg)) return 'No connection. Showing your last saved card.';
    return msg;
  }

  // ── Claim ───────────────────────────────────────────────
  function claimView(prefill) {
    const tokens = get('tpn.trackTokens') || {};
    const claimFromLink = prefill && prefill.order && prefill.token;
    const orders = Object.keys(tokens);
    view.innerHTML = `
      <h1>Your <em>stamp card</em></h1>
      <p class="lead">Every paid order of the minimum amount earns a stamp — automatically. Fill the card, get the reward.</p>
      <section class="card glass">
        ${claimFromLink || orders.length ? `
          <label class="form-label" for="phone">Your mobile number</label>
          <input id="phone" class="form-input" type="tel" inputmode="tel" autocomplete="tel" placeholder="0917 123 4567">
          <p class="muted" style="margin-top:6px">Same number you gave with your order. We keep only a scrambled version of it.</p>
          <div class="err" id="err" role="alert"></div>
          <div class="btn-row"><button class="btn-next" id="claimBtn">Show my card</button></div>`
        : `<p>To start a card, order with your mobile number — online, or at the counter (scan the QR on your receipt).</p>
           <div class="btn-row"><a class="btn-next" href="./#menu" style="text-align:center;text-decoration:none;padding-top:15px">Order now</a></div>`}
      </section>`;
    const btn = document.getElementById('claimBtn');
    if (!btn) return;
    btn.onclick = async () => {
      const phone = document.getElementById('phone').value.trim(), err = document.getElementById('err');
      err.textContent = ''; btn.disabled = true; btn.textContent = 'Checking…';
      const tries = claimFromLink ? [[prefill.order, prefill.token]] : orders.map(o => [o, tokens[o].t]);
      let lastErr = null;
      for (const [order, token] of tries) {
        const { data, error } = await sb.rpc('claim_stamp_card', { p_phone: phone, p_order_number: order, p_track_token: token });
        if (!error) { put(KEY, data); history.replaceState(null, '', location.pathname); return cardView(); }
        lastErr = error.message;
        if (/bad_phone|too_many/.test(lastErr)) break;
      }
      err.textContent = friendly(lastErr); btn.disabled = false; btn.textContent = 'Show my card';
    };
  }

  // ── Card ────────────────────────────────────────────────
  function drawCard(c, offline) {
    const need = c.needed || 10, have = Math.max(0, c.stamps || 0), full = have >= need;
    view.innerHTML = `
      <h1>${full ? 'Reward <em>ready!</em>' : 'Your <em>stamp card</em>'}</h1>
      <p class="lead">Card for the number ending in <strong>${E(c.last4)}</strong>${offline ? ' · <span class="muted">offline — last saved</span>' : ''}</p>
      <section class="card glass" aria-label="${have} of ${need} stamps">
        <div class="count"><strong>${have}</strong> of ${need} stamps</div>
        <div class="stamps">${Array.from({ length: need }, (_, i) => `<div class="stamp ${i < have ? 'on' : ''}" aria-hidden="true">${i < have ? '🍲' : i + 1}</div>`).join('')}</div>
        <div class="reward">🎁 ${E(c.reward || 'Reward')} ${c.min_order ? `<div class="muted">1 stamp per paid order of ${E(peso(c.min_order))} or more</div>` : ''}</div>
        ${c.enabled === false ? '<p class="muted" style="margin-top:8px">The stamp card is paused right now. Stamps you have are kept.</p>' : ''}
        <div class="btn-row">
          <button class="btn-next" id="showCode" ${full ? '' : 'disabled title="Collect all stamps first"'}>${full ? 'Show code to staff' : 'Collect ' + (need - have) + ' more'}</button>
        </div>
      </section>
      <section class="card glass"><h2 style="font-size:16px;color:var(--ink);margin-bottom:6px">History</h2>
        <ul class="hist">${(c.history || []).map(h => `<li><span>${{ stamp: '🍲 Stamp', reversal: '↩️ Removed (refund)', redeem: '🎁 Reward', adjust: 'Adjustment' }[h.kind] || E(h.kind)}</span>
          <span class="muted">${E(new Date(h.at).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' }))}</span></li>`).join('') || '<li class="muted">No stamps yet.</li>'}</ul></section>
      <p style="text-align:center"><button class="btn-ghost" id="forget" style="font-size:13px;padding:8px 14px">Remove card from this phone</button></p>`;
    const sc = document.getElementById('showCode'); if (sc && full) sc.onclick = codeView;
    document.getElementById('forget').onclick = async () => {
      if (await tpnConfirm('Remove the card from this phone? Your stamps stay safe — claim it again any time with a receipt.', { confirmText: 'Remove' })) {
        localStorage.removeItem(KEY); localStorage.removeItem(CACHE); claimView();
      }
    };
  }
  async function cardView() {
    const me = get(KEY); if (!me) return claimView(paramsClaim());
    const cached = get(CACHE); if (cached) drawCard(cached, true);
    const { data, error } = await sb.rpc('my_stamp_card', { p_card: me.card_id, p_secret: me.device_secret });
    if (error) {
      if (/card_not_on_this_device/.test(error.message)) { localStorage.removeItem(KEY); return claimView(paramsClaim()); }
      if (!cached) view.innerHTML = `<p class="err">${E(friendly(error.message))}</p>`;
      return;
    }
    put(CACHE, data); drawCard(data, false);
  }

  // ── Rotating code ───────────────────────────────────────
  async function codeView() {
    const me = get(KEY);
    view.innerHTML = `<section class="card glass code-view" aria-live="polite">
        <h1>Show this to <em>staff</em></h1><p class="muted">It changes every 30 seconds and works once.</p>
        <div class="code-qr" id="qr" role="img" aria-label="Rewards QR code"></div>
        <div class="code-num" id="num">······</div><div class="ring"><i id="bar" style="width:100%"></i></div>
        <div class="btn-row"><button class="btn-ghost" id="back">Back to card</button></div></section>`;
    document.getElementById('back').onclick = () => { clearInterval(codeTimer); cardView(); };
    const tick = async () => {
      const { data, error } = await sb.rpc('stamp_card_code', { p_card: me.card_id, p_secret: me.device_secret });
      if (error) { document.getElementById('num').textContent = '—'; document.getElementById('qr').innerHTML = `<p class="err">${E(friendly(error.message))}</p>`; return; }
      const q = qrcode(0, 'M'); q.addData('TPNR:' + data.card_id + ':' + data.code); q.make();
      document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      document.getElementById('num').textContent = data.code.slice(0, 3) + ' ' + data.code.slice(3);
      const bar = document.getElementById('bar'); bar.style.transition = 'none'; bar.style.width = (data.valid_for / 30 * 100) + '%';
      requestAnimationFrame(() => { bar.style.transition = `width ${data.valid_for}s linear`; bar.style.width = '0%'; });
      clearTimeout(codeTimer); codeTimer = setTimeout(tick, data.valid_for * 1000 + 200);
    };
    tick();
  }

  function paramsClaim() {
    const p = new URLSearchParams(location.search), order = p.get('claim'), token = p.get('t');
    return order && token && /^[A-Za-z0-9-]{4,64}$/.test(order) && /^[0-9a-f-]{36}$/i.test(token) ? { order, token } : null;
  }
  if (get(KEY)) cardView(); else claimView(paramsClaim());
})();
</script>
</body>
</html>
