<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20260812"></script>
<script src="tpn-supabase.js?v=20260812"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0a00">
<title>Tyo Paeng Nyo · Dine-In Floor</title>
<script>
  (function(){
    var p = window.location.pathname;
    if (/\.html$/.test(p)) {
      history.replaceState(null, '', p.replace(/\.html$/, '') + window.location.search + window.location.hash);
    }
  })();
  // UnoSys: global error boundary — the floor panel is a busy realtime
  // surface, so we swallow uncaught errors instead of letting the DOM
  // freeze on the manager. All errors still log for debugging.
  window.addEventListener('error', function(ev){ console.error('[Floor uncaught]', ev.error || ev.message); });
  window.addEventListener('unhandledrejection', function(ev){ console.error('[Floor unhandled]', ev.reason); });
  // UnoSys: XSS-safe escape used on every DB / user value that hits innerHTML.
  window.E = function(v){
    if (v === null || v === undefined) return '';
    const M = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
    return String(v).replace(/[&<>"']/g, c => M[c]);
  };
  window.N = function(v, d){
    const n = Number(v); d = (typeof d === 'number') ? d : 2;
    return Number.isFinite(n) ? n.toFixed(d) : (0).toFixed(d);
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@300;400;500;600&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --brick: #8B1A0E; --brick-dark: #6a1208; --brick-light: #c4392a;
    --gold: #c8922a; --gold-light: #e8b84b;
    --cream: #fdf6ec; --cream-dark: #f5ead8;
    --charcoal: #1a0a00; --text: #2d1a0a; --text-muted: #7a5c3a;
    --surface: #fff8f0; --border: #e8d5b8;
    --green: #2d7a4f; --green-light: #e8f5e0;
    --amber: #c8922a; --amber-light: #fff8e8;
    --red: #8B1A0E; --red-light: #fff0ee;
    --blue: #1a4a7a; --blue-light: #e8f0fa;
    --gray: #9e9e9e; --gray-light: #f5f5f5;
    --shadow: 0 2px 16px rgba(26,10,0,0.10);
    --radius: 14px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }

  /* ── TOPBAR ── */
  .topbar {
    background: var(--charcoal); padding: 0 20px; height: 60px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-logo { font-family: 'Playfair Display', serif; font-size: 18px; color: #fff; font-weight: 700; }
  .topbar-sub { font-size: 12px; color: var(--gold-light); font-weight: 500; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .topbar-badge { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
  .topbar-btn { background: var(--brick); border: none; color: #fff; font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.2s; }
  .topbar-btn:hover { background: var(--brick-light); }
  .topbar-btn.secondary { background: rgba(255,255,255,0.1); }
  .topbar-btn.secondary:hover { background: rgba(255,255,255,0.2); }

  /* ── TAB NAV ── */
  .tab-nav { background: #fff; border-bottom: 2px solid var(--border); display: flex; overflow-x: auto; scrollbar-width: none; }
  .tab-nav::-webkit-scrollbar { display: none; }
  .tab-btn { flex-shrink: 0; padding: 14px 20px; font-size: 13px; font-weight: 700; color: var(--text-muted); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; font-family: 'DM Sans', sans-serif; transition: color 0.18s; display: flex; align-items: center; gap: 6px; }
  .tab-btn.active { color: var(--brick); border-bottom-color: var(--brick); }
  .tab-btn .badge { background: var(--brick); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center; }
  .tab-btn .badge.amber { background: var(--amber); }
  .tab-btn .badge.green { background: var(--green); }

  /* ── CONTENT ── */
  .content { padding: 20px 16px 100px; max-width: 1200px; margin: 0 auto; }

  /* ── STAT TILES ── */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  @media (max-width: 700px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat-tile { background: #fff; border-radius: var(--radius); padding: 16px; border: 1.5px solid var(--border); }
  .stat-clickable { cursor: pointer; transition: all 0.18s; }
  .stat-clickable:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--gold); }
  .stat-clickable:active { transform: translateY(0); }
  .stat-label { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-weight: 700; color: var(--text); font-family: 'Playfair Display', serif; }
  .stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .stat-tile.red .stat-value { color: var(--brick); }
  .stat-tile.green .stat-value { color: var(--green); }
  .stat-tile.amber .stat-value { color: var(--amber); }

  /* ── BRANCH + TABLE MANAGEMENT ── */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .section-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; }
  .action-btn { background: var(--brick); color: #fff; border: none; padding: 9px 18px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.2s; display: flex; align-items: center; gap: 6px; }
  .action-btn:hover { background: var(--brick-light); }
  .action-btn.secondary { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
  .action-btn.secondary:hover { border-color: var(--brick); color: var(--brick); }
  .action-btn.green-btn { background: var(--green); }
  .action-btn.green-btn:hover { background: #236040; }

  /* ── BRANCH SELECTOR ── */
  .branch-selector { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .branch-pill { padding: 8px 16px; border-radius: 24px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: #fff; color: var(--text-muted); transition: all 0.18s; }
  .branch-pill.active { background: var(--charcoal); color: #fff; border-color: var(--charcoal); }

  /* ── FLOOR MAP ── */
  .floor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .table-card {
    background: #fff; border-radius: var(--radius); border: 2px solid var(--border);
    overflow: hidden; cursor: pointer; transition: all 0.2s;
    box-shadow: 0 1px 6px rgba(0,0,0,0.04);
  }
  .table-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
  .table-card.occupied { border-color: var(--amber); }
  .table-card.active-orders { border-color: var(--brick); }
  .table-card.ready { border-color: var(--green); }
  .table-card.bill-requested { border-color: var(--blue); animation: borderPulse 1.5s infinite; }
  @keyframes borderPulse { 0%,100%{border-color:var(--blue)} 50%{border-color:#5090d0} }

  .table-header { padding: 12px 14px 10px; display: flex; align-items: center; justify-content: space-between; }
  .table-num { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: var(--text); }
  .table-status-dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-empty { background: var(--gray); }
  .dot-occupied { background: var(--amber); }
  .dot-active { background: var(--brick); animation: pulse 1.5s infinite; }
  .dot-ready { background: var(--green); }
  .dot-bill { background: var(--blue); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .table-body { padding: 0 14px 14px; }
  .table-status-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
  .status-empty { color: var(--gray); }
  .status-occupied { color: var(--amber); }
  .status-active { color: var(--brick); }
  .status-ready { color: var(--green); }
  .status-bill { color: var(--blue); }

  .table-guest { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .table-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }
  .table-order-count { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); margin-bottom: 8px; }
  .table-total { font-size: 15px; font-weight: 700; color: var(--brick); margin-bottom: 10px; }
  .table-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .t-btn { flex: 1; padding: 7px 0; border-radius: 8px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.18s; min-width: 60px; }
  .t-btn.view { background: var(--cream-dark); color: var(--text); }
  .t-btn.view:hover { background: var(--border); }
  .t-btn.advance { background: var(--brick); color: #fff; }
  .t-btn.advance:hover { background: var(--brick-light); }
  .t-btn.clear { background: var(--gray-light); color: var(--gray); }
  .t-btn.clear:hover { background: #e0e0e0; }
  .t-btn.bill { background: var(--blue); color: #fff; }
  .t-btn.bill:hover { background: #1a3a6a; }

  .qr-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--cream-dark); border-radius: 20px; padding: 4px 10px; font-size: 10px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; cursor: pointer; }
  .qr-badge:hover { background: var(--border); }

  /* ── ORDERS LIST ── */
  .orders-filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filter-chip { padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: #fff; color: var(--text-muted); transition: all 0.18s; }
  .filter-chip.active { background: var(--charcoal); color: #fff; border-color: var(--charcoal); }
  .orders-grid { display: flex; flex-direction: column; gap: 10px; }
  .order-card { background: #fff; border-radius: var(--radius); border: 1.5px solid var(--border); padding: 16px; transition: border-color 0.18s; }
  .order-card.received { border-left: 4px solid var(--amber); }
  .order-card.preparing { border-left: 4px solid var(--brick); }
  .order-card.ready { border-left: 4px solid var(--green); }
  .order-card.done { border-left: 4px solid var(--gray); opacity: 0.75; }
  .order-card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
  .order-card-ref { font-size: 12px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.05em; }
  .order-card-table { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700; }
  .order-status-pill { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0; }
  .pill-received { background: var(--amber-light); color: var(--amber); }
  .pill-preparing { background: var(--red-light); color: var(--brick); }
  .pill-ready { background: var(--green-light); color: var(--green); }
  .pill-done { background: var(--gray-light); color: var(--gray); }
  .order-guest-info { display: flex; gap: 16px; font-size: 12px; color: var(--text-muted); margin-bottom: 10px; flex-wrap: wrap; }
  .order-items-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .order-item-row { display: flex; justify-content: space-between; font-size: 13px; }
  .order-item-name { color: var(--text); }
  .order-item-price { color: var(--text-muted); font-weight: 600; }
  .order-flags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .order-flag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  .flag-allergy { background: #ffebee; color: #c62828; }
  .flag-req { background: var(--amber-light); color: var(--amber); }
  .flag-bill { background: var(--blue-light); color: var(--blue); }
  .order-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border); }
  .order-total { font-size: 16px; font-weight: 700; color: var(--brick); }
  .order-time { font-size: 11px; color: var(--text-muted); }
  .order-actions { display: flex; gap: 8px; }
  .o-btn { padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.18s; }
  .o-btn.advance { background: var(--brick); color: #fff; }
  .o-btn.advance:hover { background: var(--brick-light); }
  .o-btn.done-btn { background: var(--green); color: #fff; }
  .o-btn.view { background: var(--cream-dark); color: var(--text); }

  /* ── SETTINGS PANEL ── */
  .settings-card { background: #fff; border-radius: var(--radius); border: 1.5px solid var(--border); padding: 20px; margin-bottom: 16px; }
  .settings-card-title { font-size: 13px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 12px; }
  .settings-row:last-child { border-bottom: none; padding-bottom: 0; }
  .settings-label { font-size: 14px; font-weight: 600; }
  .settings-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .settings-input { padding: 8px 12px; border-radius: 8px; border: 1.5px solid var(--border); font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--text); outline: none; width: 90px; text-align: center; }
  .settings-input:focus { border-color: var(--brick); }
  .toggle-switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; background: #ccc; border-radius: 13px; cursor: pointer; transition: 0.3s; }
  .toggle-slider::before { content: ''; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.3s; }
  .toggle-switch input:checked + .toggle-slider { background: var(--brick); }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }
  .branch-list { display: flex; flex-direction: column; gap: 10px; }
  .branch-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: var(--cream); border: 1px solid var(--border); }
  .branch-item-name { flex: 1; font-size: 14px; font-weight: 600; }
  .branch-item-tables { font-size: 12px; color: var(--text-muted); }
  .add-branch-form { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .add-branch-form input { flex: 1; min-width: 140px; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--border); font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none; }
  .add-branch-form input:focus { border-color: var(--brick); }
  .menu-manager-list { display: flex; flex-direction: column; gap: 8px; }
  .menu-item-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--cream); border: 1px solid var(--border); }
  .menu-item-emoji { font-size: 24px; flex-shrink: 0; }
  .menu-item-info { flex: 1; }
  .menu-item-name { font-size: 14px; font-weight: 600; }
  .menu-item-price { font-size: 12px; color: var(--brick); font-weight: 700; }
  .avail-toggle { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .avail-toggle.on { background: var(--green-light); color: var(--green); }
  .avail-toggle.off { background: var(--gray-light); color: var(--gray); }

  /* ── MODAL ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.22s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-box { background: #fff; border-radius: 20px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
  .modal-top { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; }
  .modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-muted); }
  .modal-content { padding: 20px 24px; }
  .modal-footer { padding: 14px 24px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
  .modal-btn { padding: 10px 22px; border-radius: 10px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .modal-btn.primary { background: var(--brick); color: #fff; }
  .modal-btn.secondary { background: var(--cream-dark); color: var(--text); }
  .order-detail-items { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .detail-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px; background: var(--cream); border-radius: 10px; }
  .detail-item-emoji { font-size: 24px; }
  .detail-item-info { flex: 1; }
  .detail-item-name { font-size: 14px; font-weight: 700; }
  .detail-item-meta { font-size: 12px; color: var(--text-muted); }
  .detail-item-price { font-size: 14px; font-weight: 700; color: var(--brick); }

  /* ── QR MODAL ── */
  .qr-display { text-align: center; padding: 10px 0 20px; }
  .qr-placeholder { width: 180px; height: 180px; border: 3px dashed var(--border); border-radius: 12px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; font-size: 72px; background: var(--cream); }
  .qr-url { font-size: 11px; color: var(--text-muted); word-break: break-all; background: var(--cream-dark); padding: 8px 12px; border-radius: 8px; font-family: monospace; }

  /* ── TOAST ── */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--charcoal); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 600; z-index: 999; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── CALL ALERT ── */
  .call-alert { position: fixed; top: 70px; right: 16px; z-index: 600; background: var(--blue); color: #fff; border-radius: 14px; padding: 14px 18px; max-width: 280px; box-shadow: 0 6px 24px rgba(0,0,0,0.25); display: none; animation: slideIn 0.3s; }
  .call-alert.show { display: block; }
  @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .call-alert-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .call-alert-sub { font-size: 12px; opacity: 0.85; margin-bottom: 10px; }
  .call-alert-dismiss { background: rgba(255,255,255,0.2); border: none; color: #fff; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 8px; cursor: pointer; }

  @media (max-width: 640px) {
    .stat-value { font-size: 22px; }
    .floor-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .tab-btn { padding: 12px 14px; font-size: 12px; }
  }
</style>
</head>
<body>

<!-- AUTH GATE — hides content until we've confirmed the user is manager+ -->
<style>
  #tpn-auth-gate {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--charcoal); color: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    font-family: 'DM Sans', sans-serif;
  }
  #tpn-auth-gate .g-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--gold-light); }
  #tpn-auth-gate .g-sub   { font-size: 14px; color: rgba(255,255,255,0.7); text-align: center; max-width: 320px; }
  #tpn-auth-gate .g-spin  { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,0.15); border-top-color: var(--gold); border-radius: 50%; animation: gspin 0.9s linear infinite; }
  @keyframes gspin { to { transform: rotate(360deg); } }
  #tpn-auth-gate .g-btn { margin-top: 12px; background: var(--brick); color: #fff; border: none; padding: 10px 22px; border-radius: 10px; font-weight: 700; font-family: 'DM Sans', sans-serif; cursor: pointer; }
  body.tpn-authed #tpn-auth-gate { display: none; }
  body:not(.tpn-authed) > *:not(#tpn-auth-gate):not(script) { visibility: hidden; }

  /* ── Void request affordance in the order detail modal ──

  .detail-void-btn {

</style>

<script>
// ─── STATE ───
const ROLE = 'manager'; // In real system, this comes from login
let currentTab = 'floor';
let currentBranch = 'Las Piñas';
let orderFilter = 'all';
let callAlertTimeout = null;

// Branches with configurable tables — LIVE data only, single branch (Las Piñas).
// Table count is resolved from Supabase in loadOrdersFromSupabase() → ensureBranchUuids().
let branches = [
  { id: 'laspinas', name: 'Las Piñas', tables: 8, active: true },
];

// Tables per branch — dynamically generated
let tableStates = {}; // keyed by branchId_tableNum

function initTableStates() {
  branches.forEach(branch => {
    for (let i = 1; i <= branch.tables; i++) {
      const key = branch.id + '_' + i;
      if (!tableStates[key]) {
        tableStates[key] = { status: 'empty', guest: null, pax: 0, orders: [], sessionTotal: 0, billRequested: false, openedAt: null };
      }
    }
  });
}

// Live orders array — populated from Supabase, empty on boot.
let dineInOrders = [];

// No seed data — everything is loaded from Supabase.
function seedTableStates() { /* intentionally empty — real data only */ }

// Menu availability — loaded from Supabase menu_items table via loadMenuFromDB()
let menuAvailability = [];

// True when signed in as the shared 'dine_in_display' screen account
// rather than as a person. Set by tpnAuthGate().
let IS_DISPLAY_ACCOUNT = false;
// order_item ids with a void request already awaiting a manager.
let _pendingVoidItemIds = new Set();

/* ── DISPLAY MODE ──────────────────────────────────────────────
   The screen account gets the floor at a glance and the ability to
   move tickets along. It does NOT get the levers that move money or
   change the menu: no 86-ing items, no adding tables, no branch
   settings, and no revenue drilldown. Those are hidden here in the UI
   and refused by RLS in the database — the hiding is courtesy, the
   RLS is the actual control.
   ────────────────────────────────────────────────────────────── */
function applyDisplayMode() {
  document.querySelectorAll('[data-manager-only]').forEach(el => { el.style.display = 'none'; });
}

/* ── VOID REQUESTS ─────────────────────────────────────────────
   Nobody voids from this panel. Requests go to the portal's Void
   Requests tab where a manager+ approves or denies them.
   ────────────────────────────────────────────────────────────── */
function _voidItemLabel(orderDbId, itemId) {
  const o = dineInOrders.find(x => x.dbId === orderDbId);
  const it = o && (o.items || []).find(x => x.id === itemId);
  return it ? `${it.qty}× ${it.name}` : 'this item';
}

async function requestVoid(orderDbId, itemId) {
  const itemName = _voidItemLabel(orderDbId, itemId);
  const reason = window.prompt(
    'Ask a manager to void this line?\n\n' + itemName +
    '\n\nReason (min 3 characters) — the manager sees this:', '');
  if (reason === null) return;
  if (!reason || reason.trim().length < 3) {
    showToast('⚠️ Give a reason of at least 3 characters.');
    return;
  }
  try {
    await TPN.requestVoid({ orderId: orderDbId, itemId, reason: reason.trim() });
    _pendingVoidItemIds.add(itemId);
    showToast('📨 Sent — waiting for a manager to approve.');
    closeModal();
  } catch (e) {
    showToast('⚠️ ' + TPN.voidRequestErrorText(e));
  }
}

async function refreshPendingVoids() {
  try {
    const reqs = await TPN.listVoidRequests({ status: 'pending', limit: 200, mineOnly: true });
    _pendingVoidItemIds = new Set(reqs.map(r => r.order_item_id).filter(Boolean));
  } catch (e) { /* non-fatal */ }
}

// ─── AUTH GATE ───
async function tpnAuthGate() {
  const msg = document.getElementById('tpn-auth-msg');
  const btn = document.getElementById('tpn-auth-btn');
  try {
    // Wait for supabase-js to restore session from localStorage
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      msg.textContent = 'You need to be signed in as manager+ to view the floor panel.';
      btn.style.display = 'inline-block';
      return false;
    }
    const profile = await TPN.loadProfile();
    if (!profile) {
      msg.textContent = 'Your account is not linked to a staff profile.';
      btn.style.display = 'inline-block';
      return false;
    }
    if (profile.employment_status && profile.employment_status !== 'active') {
      msg.textContent = 'Your account is not active. Contact a manager.';
      btn.style.display = 'inline-block';
      return false;
    }
    // Two ways in:
    //   1. dine_in_display — the dedicated screen account for the dining floor
    //   2. manager and higher — the original audience
    // dine_in_display sits BELOW dining in the enum, so hasRole() refuses
    // it everywhere else. This is the one surface it is allowed on, and it
    // runs in a reduced mode (see applyDisplayMode).
    IS_DISPLAY_ACCOUNT = (profile.role === 'dine_in_display');
    if (!IS_DISPLAY_ACCOUNT && !TPN.hasRole('manager')) {
      msg.textContent = 'The floor panel is for manager+ staff only. Your account: ' + (profile.role || 'unknown') + '.';
      btn.style.display = 'inline-block';
      return false;
    }
    // A kitchen screen must never end up here — it has its own surface.
    if (profile.role === 'kitchen_display') {
      window.location.replace('tpn-kitchen-station');
      return false;
    }
    // Reveal content
    document.body.classList.add('tpn-authed');
    if (IS_DISPLAY_ACCOUNT) {
      document.body.classList.add('tpn-display-mode');
      applyDisplayMode();
    }
    // Reflect the role in the badge
    const badge = document.getElementById('role-badge');
    if (badge) {
      badge.textContent = IS_DISPLAY_ACCOUNT
        ? 'Dine-In Display'
        : (profile.role || 'staff').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }
    return true;
  } catch (e) {
    console.error('Auth gate error:', e);
    msg.textContent = 'Could not verify your login. Try refreshing.';
    btn.style.display = 'inline-block';
    return false;
  }
}

// ─── INIT ───
document.addEventListener('DOMContentLoaded', async () => {
  const authed = await tpnAuthGate();
  if (!authed) return;
  // Resolve real table count from DB before initializing states
  try {
    await ensureBranchUuids();
    const uuid = branchUuidCache['laspinas'];
    if (uuid) {
      const dbTables = await TPN.getTablesForBranch(uuid);
      if (dbTables && dbTables.length) branches[0].tables = dbTables.length;
    }
  } catch(e) { console.warn('table count fetch:', e); }
  initTableStates();
  seedTableStates();
  updateBadges();
  renderTab();
  await loadOrdersFromSupabase();
  await refreshPendingVoids();
  loadMenuFromDB();
  subscribeToRealtime();
  checkCallStaff();

  // Watch our own void requests so the ⏳ clears and staff hear the
  // verdict without anyone touching the screen.
  TPN.subscribeVoidRequests(async (payload) => {
    const row = payload?.new;
    if (!row) return;
    const me = TPN.currentUser();
    if (!me || row.requested_by !== me.id) return;
    await refreshPendingVoids();
    if (payload.eventType === 'UPDATE' && row.status !== 'pending') {
      const what = row.item_name || 'the order';
      if (row.status === 'approved') showToast('✅ Void approved — ' + what);
      if (row.status === 'denied')   showToast('❌ Void denied — ' + what +
        (row.review_note ? ' (' + row.review_note + ')' : ''));
      dineInOrders = [];
      await loadOrdersFromSupabase();
      renderTab();
      updateBadges();
    }
  });
});

// ─── Cache: DB branch UUID lookup ───
const branchUuidCache = {}; // { 'laspinas': uuid }
async function ensureBranchUuids() {
  const dbBranches = await TPN.getBranches();
  dbBranches.forEach(b => branchUuidCache[b.code] = b.id);
  // Map branches array (which uses 'laspinas' etc as string ids) to DB UUIDs
}

// ─── LOAD ORDERS + TABLE SIGNALS FROM SUPABASE ───
async function loadOrdersFromSupabase() {
  try {
    await ensureBranchUuids();
    for (const branch of branches) {
      const branchUuid = branchUuidCache[branch.id];
      if (!branchUuid) continue;
      const orders = await TPN.listActiveOrders(branchUuid);
      orders.forEach(o => integrateOrder(o, branch));
      // Load current signal state on tables
      const tables = await TPN.getTablesForBranch(branchUuid);
      tables.forEach(t => {
        const key = branch.id + '_' + t.table_number;
        if (tableStates[key]) {
          if (t.call_staff_at) tableStates[key].billRequested = true;
        }
      });
    }
    updateBadges();
    renderTab();
  } catch(e) { console.error('loadOrdersFromSupabase failed:', e); }
}

// ─── REALTIME SUBSCRIPTIONS ───
function subscribeToRealtime() {
  // Subscribe to orders across all branches
  TPN.subscribeOrders(null, async (payload) => {
    if (payload.eventType === 'INSERT') {
      const order = payload.new;
      // Find which branch
      const branch = branches.find(b => branchUuidCache[b.id] === order.branch_id);
      if (!branch) return;
      // Fetch full order with items
      try {
        const full = await TPN.getOrder(order.id);
        integrateOrder(full, branch);
        showToast(`🔔 New order from Table ${full.restaurant_tables?.table_number || '?'}!`);
        updateBadges();
        if (currentTab === 'floor' || currentTab === 'orders') renderTab();
      } catch(e) { console.error('fetch new order failed:', e); }
    } else if (payload.eventType === 'UPDATE') {
      // Update existing order status
      const updated = payload.new;
      const existing = dineInOrders.find(o => o.dbId === updated.id);
      // Mapped, for the same reason as integrateOrder().
      if (existing) {
        existing.status = mapDbStatusToUi(updated.status);
        if (updated.total != null) existing.total = updated.total;
      }
      updateBadges();
      if (currentTab === 'floor' || currentTab === 'orders') renderTab();
    }
  });

  // Subscribe to restaurant_tables for call-staff / bill-request signals
  const chan = sb.channel('restaurant_tables:all')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'restaurant_tables' }, (payload) => {
      const t = payload.new;
      const branch = branches.find(b => branchUuidCache[b.id] === t.branch_id);
      if (!branch) return;
      const key = branch.id + '_' + t.table_number;
      // Detect signal transitions
      const wasCall = payload.old?.call_staff_at, isCall = t.call_staff_at;
      const wasBill = payload.old?.bill_requested_at, isBill = t.bill_requested_at;
      if (!wasCall && isCall) {
        showCallAlert(t.table_number, branch.name);
        if (tableStates[key]) tableStates[key].billRequested = true;
      }
      if (!wasBill && isBill) {
        showToast(`💳 Table ${t.table_number}: bill request (${t.bill_payment_method || '?'})`);
        if (tableStates[key]) tableStates[key].billRequested = true;
      }
      updateBadges();
      if (currentTab === 'floor') renderTab();
    })
    .subscribe();
}

// Integrate a DB-shaped order into the local in-memory model
// DB order_status → the four UI lane names this page works in.
// Mirrors mapDbStatusToLane() in tpn-kitchen-station.html and
// mapDbStatusToUi() in index.html — keep all three in step.
function mapDbStatusToUi(s) {
  return ({
    pending:   'received',
    confirmed: 'received',
    preparing: 'preparing',
    ready:     'ready',
    served:    'done',
    completed: 'done',
    cancelled: 'done'
  })[s] || 'received';
}

function integrateOrder(dbOrder, branch) {
  if (dineInOrders.find(o => o.dbId === dbOrder.id)) return;
  const uiOrder = {
    ref:       dbOrder.order_number,
    dbId:      dbOrder.id,
    table:     dbOrder.restaurant_tables?.table_number || null,
    branch:    branch.name,
    branchId:  branch.id,
    name:      dbOrder.customer_name || 'Guest',
    pax:       1,
    specialReq: dbOrder.notes || '',
    // id + voided flag are carried so the floor can file a void REQUEST
    // against a specific line. The floor screen can never void directly.
    items:     (dbOrder.order_items || []).map(oi => ({
                  id: oi.id, name: oi.name_snapshot, qty: oi.quantity,
                  price: oi.unit_price, voided: !!oi.voided_at
                })),
    total:     dbOrder.total,
    timestamp: dbOrder.placed_at,
    // MUST be mapped, not raw. Everything downstream on this page — the
    // advance pipeline, the status pill, the filter chips, the table
    // roll-up — compares against UI lane names. Storing the raw DB
    // status ('pending' / 'confirmed') made indexOf() return -1, so a
    // freshly loaded order showed no advance button at all and could
    // never leave 'confirmed' from this surface.
    status:    mapDbStatusToUi(dbOrder.status),
    type:      dbOrder.order_type
  };
  dineInOrders.push(uiOrder);
  if (uiOrder.table) {
    const key = branch.id + '_' + uiOrder.table;
    const tbl = tableStates[key];
    if (tbl) {
      tbl.status = 'active-orders';
      tbl.guest = uiOrder.name;
      tbl.pax = uiOrder.pax;
      tbl.openedAt = tbl.openedAt || uiOrder.timestamp;
      tbl.orders.push(uiOrder);
      tbl.sessionTotal += uiOrder.total;
    }
  }
}

function checkCallStaff() {
  // Also listen for postMessage from QR menu opened in same tab/iframe
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'TPN_DINE_IN_ORDER') {
      const order = e.data.order;
      if (!dineInOrders.find(o => o.ref === order.ref)) {
        dineInOrders.push(order);
        showToast(`🔔 New order: Table ${order.table}!`);
        updateBadges();
        if (currentTab === 'floor' || currentTab === 'orders') renderTab();
      }
    }
  });
}

function showCallAlert(table, branch) {
  const el = document.getElementById('call-alert');
  document.getElementById('call-alert-sub').textContent = `Table ${table} (${branch}) is requesting assistance or the bill.`;
  el.classList.add('show');
  clearTimeout(callAlertTimeout);
  callAlertTimeout = setTimeout(() => el.classList.remove('show'), 8000);
}
function dismissCallAlert() { document.getElementById('call-alert').classList.remove('show'); }

// ─── TABS ───
function showTab(tab) {
  // Menu Status and Settings change the menu and the branch config —
  // manager territory. The screen account is bounced back to the floor.
  if (IS_DISPLAY_ACCOUNT && (tab === 'menu' || tab === 'settings')) {
    showToast('That section is for managers.');
    tab = 'floor';
  }
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  renderTab();
}

function renderTab() {
  const el = document.getElementById('main-content');
  if (currentTab === 'floor') el.innerHTML = renderFloor();
  else if (currentTab === 'orders') el.innerHTML = renderOrders();
  else if (currentTab === 'menu') el.innerHTML = renderMenuStatus();
  else if (currentTab === 'settings') el.innerHTML = renderSettings();
  attachEvents();
}

function updateBadges() {
  const branch = branches.find(b => b.name === currentBranch);
  if (!branch) return;
  let occupied = 0;
  for (let i = 1; i <= branch.tables; i++) {
    const key = branch.id + '_' + i;
    if (tableStates[key]?.status !== 'empty') occupied++;
  }
  document.getElementById('badge-occupied').textContent = occupied;
  const activeOrders = dineInOrders.filter(o => o.branch === currentBranch && o.status !== 'done').length;
  document.getElementById('badge-orders').textContent = activeOrders;
}

// ─── FLOOR MAP ───
function renderFloor() {
  const branch = branches.find(b => b.name === currentBranch);
  if (!branch) return '<p>No branch selected.</p>';

  // Stats
  let occupied = 0, activeOrd = 0, totalRev = 0, billReq = 0;
  for (let i = 1; i <= branch.tables; i++) {
    const key = branch.id + '_' + i;
    const tbl = tableStates[key];
    if (!tbl) continue;
    if (tbl.status !== 'empty') { occupied++; totalRev += tbl.sessionTotal; }
    if (tbl.billRequested) billReq++;
    activeOrd += tbl.orders.filter(o => o.status !== 'done').length;
  }

  let html = `
  <div class="stat-grid">
    <div class="stat-tile stat-clickable" onclick="showOccupiedTablesList('${branch.id}')"><div class="stat-label">Tables Occupied</div><div class="stat-value">${occupied}/${branch.tables}</div><div class="stat-sub">Tap to view occupied →</div></div>
    <div class="stat-tile red stat-clickable" onclick="showTab('orders')"><div class="stat-label">Active Orders</div><div class="stat-value">${activeOrd}</div><div class="stat-sub">Tap to view orders →</div></div>
    <div class="stat-tile amber stat-clickable" onclick="showBillRequestedList('${branch.id}')"><div class="stat-label">Bill Requested</div><div class="stat-value">${billReq}</div><div class="stat-sub">Tap to view tables →</div></div>
    ${IS_DISPLAY_ACCOUNT
      /* A wall screen in the dining room is visible to guests. Revenue
         does not belong on it. */
      ? `<div class="stat-tile green"><div class="stat-label">Covers Tonight</div><div class="stat-value">${dineInOrders.length}</div><div class="stat-sub">orders this session</div></div>`
      : `<div class="stat-tile green stat-clickable" onclick="showRevenueModal(${totalRev})"><div class="stat-label">Session Revenue</div><div class="stat-value">₱${totalRev.toLocaleString()}</div><div class="stat-sub">Tap for breakdown →</div></div>`}
  </div>
  <div class="section-header">
    <div class="section-title">Floor Map</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${IS_DISPLAY_ACCOUNT ? '' : `<button class="action-btn secondary" onclick="openAddTableModal()">+ Add Table</button>`}
    </div>
  </div>
  <div class="branch-selector" id="branch-selector">`;
  branches.filter(b => b.active).forEach(b => {
    html += `<div class="branch-pill ${b.name === currentBranch ? 'active' : ''}" onclick="switchBranch('${E(b.name)}')">${E(b.name)}</div>`;
  });
  html += `</div><div class="floor-grid">`;

  for (let i = 1; i <= branch.tables; i++) {
    const key = branch.id + '_' + i;
    const tbl = tableStates[key] || { status: 'empty' };
    const status = tbl.status;

    const statusMap = {
      'empty': { label: 'Empty', dotClass: 'dot-empty', labelClass: 'status-empty', cardClass: '' },
      'occupied': { label: 'Occupied', dotClass: 'dot-occupied', labelClass: 'status-occupied', cardClass: 'occupied' },
      'active-orders': { label: 'Active Orders', dotClass: 'dot-active', labelClass: 'status-active', cardClass: 'active-orders' },
      'ready': { label: 'Food Ready', dotClass: 'dot-ready', labelClass: 'status-ready', cardClass: 'ready' },
      'bill-requested': { label: '💳 Bill Requested', dotClass: 'dot-bill', labelClass: 'status-bill', cardClass: 'bill-requested' },
    };
    const s = statusMap[status] || statusMap['empty'];
    const tableOrders = tbl.orders?.filter(o => o.status !== 'done') || [];
    const elapsed = tbl.openedAt ? Math.floor((Date.now() - new Date(tbl.openedAt)) / 60000) + 'm' : '';

    const qrUrl = `tpn-table-menu?table=${i}&branch=${encodeURIComponent(branch.name)}`;

    html += `<div class="table-card ${s.cardClass}" onclick="openTableModal(${i}, '${branch.id}')">
      <div class="table-header">
        <div class="table-num">Table ${i}</div>
        <div class="table-status-dot ${s.dotClass}"></div>
      </div>
      <div class="table-body">
        <div class="table-status-label ${s.labelClass}">${s.label}</div>
        ${status !== 'empty' ? `
          <div class="table-guest">${tbl.guest || '—'}</div>
          <div class="table-meta">${tbl.pax} guest(s) · ${elapsed} ago</div>
          <div class="table-order-count">📋 ${tableOrders.length} active order(s)</div>
          <div class="table-total">₱${(tbl.sessionTotal || 0).toLocaleString('en', {minimumFractionDigits:2})}</div>
        ` : `<div style="padding:10px 0;text-align:center;font-size:24px;color:var(--border)">🪑</div>`}
        <div class="qr-badge" onclick="event.stopPropagation(); openQRModal(${i}, '${branch.name}', '${qrUrl}')">📱 QR Code</div>
        <div class="table-actions">
          ${status !== 'empty' ? `
            <button class="t-btn view" onclick="event.stopPropagation(); openTableModal(${i}, '${branch.id}')">View</button>
            ${IS_DISPLAY_ACCOUNT ? '' : `
            ${tbl.billRequested ? `<button class="t-btn bill" onclick="event.stopPropagation(); closeTable(${i}, '${branch.id}')">Close Table</button>` : `<button class="t-btn advance" onclick="event.stopPropagation(); markBillReady(${i}, '${branch.id}')">Bill</button>`}
            <button class="t-btn clear" onclick="event.stopPropagation(); clearTable(${i}, '${branch.id}')">Clear</button>`}
          ` : `<button class="t-btn view" onclick="event.stopPropagation(); openQRModal(${i}, '${branch.name}', '${qrUrl}')">Open QR</button>`}
        </div>
      </div>
    </div>`;
  }

  html += `</div>`;
  return html;
}

// UnoSys sync fix (sql/15 era): advanceOrder used to only mutate local state,
// which meant the floor panel and the KDS/Orders board would drift the moment
// a floor manager tapped "→ Preparing". Now every advance pushes through
// TPN.updateOrderStatus with optimistic UI + rollback, matching index.html.
async function advanceOrder(ref) {
  const order = dineInOrders.find(o => o.ref === ref);
  if (!order) return;
  const pipeline = ['received', 'preparing', 'ready', 'done'];
  const idx = pipeline.indexOf(order.status);
  if (idx >= pipeline.length - 1) return;
  const nextStatus = pipeline[idx + 1];
  const prevStatus = order.status;

  // 'done' maps to DB status 'completed', which means payment was taken.
  // A shared wall screen doesn't get to say that — the server refuses it
  // too (display_cannot_close_orders), this just avoids the round trip and
  // the optimistic flicker.
  if (IS_DISPLAY_ACCOUNT && nextStatus === 'done') {
    showToast('Closing an order is a staff/manager action.');
    return;
  }

  // Same mapping used in index.html advanceOrder() so both stay in step.
  const uiToDb = { received: 'confirmed', preparing: 'preparing', ready: 'ready', done: 'completed' };
  const dbStatus = uiToDb[nextStatus] || nextStatus;

  // Optimistic update — flip local state + table roll-up first, then persist.
  order.status = nextStatus;
  const branch = branches.find(b => b.name === order.branch);
  if (branch) {
    const key = branch.id + '_' + order.table;
    const tbl = tableStates[key];
    if (tbl) {
      const allOrders = tbl.orders;
      const allReady = allOrders.every(o => o.status === 'ready' || o.status === 'done');
      if (allReady && tbl.status !== 'bill-requested') tbl.status = 'ready';
    }
  }
  updateBadges();
  renderTab();

  if (!order.dbId) {
    // Legacy / seed row without a DB id — nothing to sync, just show local update.
    showToast(`✅ Order ${ref} advanced to ${nextStatus}.`);
    return;
  }
  try {
    await TPN.updateOrderStatus(order.dbId, dbStatus);
    showToast(`✅ Order ${ref} → ${nextStatus}`);
  } catch (e) {
    console.error('advanceOrder sync failed:', e);
    order.status = prevStatus;   // rollback
    updateBadges();
    renderTab();
    showToast(`⚠️ Could not update — ${e.message || 'try again'}`);
  }
}

function markBillReady(tableNum, branchId) {
  const key = branchId + '_' + tableNum;
  const tbl = tableStates[key];
  if (!tbl) return;
  tbl.billRequested = true;
  tbl.status = 'bill-requested';
  tbl.orders.forEach(o => { o.billRequested = true; });
  showToast(`💳 Table ${tableNum} marked for billing.`);
  renderTab();
}

function clearTable(tableNum, branchId) {
  const key = branchId + '_' + tableNum;
  tableStates[key] = { status: 'empty', guest: null, pax: 0, orders: [], sessionTotal: 0, billRequested: false, openedAt: null };
  // Remove done orders from list
  dineInOrders = dineInOrders.filter(o => {
    const b = branches.find(br => br.id === branchId);
    return !(b && o.branch === b.name && o.table === tableNum);
  });
  showToast(`🪑 Table ${tableNum} cleared.`);
  updateBadges();
  renderTab();
}

async function closeTable(tableNum, branchId) {
  const key = branchId + '_' + tableNum;
  const tbl = tableStates[key];
  if (!tbl) return;

  // Pull the live DB numbers for every active order at this table so subtotal /
  // discount / total reflect any voids or discounts applied since page load.
  const orderIds = (tbl.orders || []).filter(o => o.dbId && o.status !== 'done').map(o => o.dbId);
  let subtotalSum = 0, discountSum = 0, totalSum = 0;
  const applied = [];
  if (orderIds.length) {
    for (const id of orderIds) {
      try {
        const full = await TPN.getOrder(id);
        subtotalSum += Number(full.subtotal || 0);
        discountSum += Number(full.discount_amount || 0);
        totalSum    += Number(full.total || 0);
        const ad = await TPN.listAppliedDiscounts(id);
        ad.forEach(a => applied.push(Object.assign({}, a, { _orderId: id })));
      } catch(e) { console.warn('closeTable refresh failed for', id, e); }
    }
  } else {
    totalSum = tbl.sessionTotal || 0;
    subtotalSum = totalSum;
  }
  tbl.sessionTotal = totalSum;

  const orderIdsJson = JSON.stringify(orderIds).replace(/"/g,'&quot;');
  const appliedBlock = applied.length
    ? applied.map(a => `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;color:var(--text-muted);"><span>💸 ${E(a.name_snapshot)}${a.legal_law?` (${E(a.legal_law)})`:''}</span><strong>−₱${Number(a.amount_applied).toFixed(2)}</strong></div>`).join('')
    : `<div style="font-size:12px;color:var(--text-muted);font-style:italic;padding:4px 0;">No discounts applied.</div>`;

  const canDiscount = TPN.hasRole && TPN.hasRole('supervisor');
  const discountBtn = canDiscount && orderIds.length
    ? `<button class="topbar-btn" style="width:100%;margin-bottom:10px;background:transparent;color:var(--brick);border:1px solid var(--brick);" onclick='openFloorDiscountPicker(${orderIdsJson}, "Table ${tableNum}", () => closeTable(${tableNum}, "${branchId}"))'>💸 Apply / manage discounts</button>`
    : '';

  openModal('Close Table ' + tableNum, `
    <p style="margin-bottom:14px;color:var(--text-muted)">Confirm payment received and close this table session.</p>
    <div style="background:var(--cream);border-radius:12px;padding:16px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px"><span>Guest</span><strong>${E(tbl.guest||'—')}</strong></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px"><span>Pax</span><strong>${tbl.pax||1}</strong></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px;color:var(--text-muted);"><span>Subtotal</span><span>₱${subtotalSum.toFixed(2)}</span></div>
      <div style="padding:6px 0;border-top:1px dashed var(--line,#e5d9c8);border-bottom:1px dashed var(--line,#e5d9c8);margin:6px 0;">
        ${appliedBlock}
        ${discountSum>0?`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;font-weight:700;"><span>Total discount</span><span style="color:var(--brick)">−₱${discountSum.toFixed(2)}</span></div>`:''}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:16px"><span>Total Paid</span><strong style="color:var(--brick)">₱${totalSum.toFixed(2)}</strong></div>
    </div>
    ${discountBtn}
  `, [
    { label: 'Cancel', cls: 'secondary', fn: 'closeModal()' },
    { label: '✓ Confirm & Close Table', cls: 'primary', fn: `confirmCloseTable(${tableNum}, '${branchId}')` }
  ]);
}

/* ────────────────────────────────────────────────────────────────
   Actually close the table.

   This used to be `clearTable(); closeModal();` — purely local. No
   order was written to 'completed' and neither signal was
   acknowledged, so a refresh brought the table straight back,
   occupied and still flagged for billing. The cash was taken and the
   system never knew.

   Now: every live order at the table is advanced to completed, both
   table signals are cleared server-side, and only then is the local
   state reset.
   ──────────────────────────────────────────────────────────────── */
async function confirmCloseTable(tableNum, branchId) {
  const key = branchId + '_' + tableNum;
  const tbl = tableStates[key];
  if (!tbl) { closeModal(); return; }

  const live = (tbl.orders || []).filter(o => o.dbId && o.status !== 'done');
  let ok = 0, failed = 0, lastErr = '';

  for (const o of live) {
    try {
      await TPN.updateOrderStatus(o.dbId, 'completed');
      o.status = 'done';
      ok++;
    } catch (e) {
      failed++;
      lastErr = e.message || String(e);
      console.error('close table — could not complete order', o.dbId, e);
    }
  }

  // Clear the call-staff / bill-request flags on the table row itself,
  // otherwise loadOrdersFromSupabase() re-raises them on next load.
  try {
    const branchUuid = branchUuidCache[branchId];
    const tables = branchUuid ? await TPN.getTablesForBranch(branchUuid) : [];
    const row = tables.find(t => Number(t.table_number) === Number(tableNum));
    if (row) {
      if (row.bill_requested_at) await TPN.ackBillRequest(row.id);
      if (row.call_staff_at)     await TPN.ackCallStaff(row.id);
    }
  } catch (e) {
    console.warn('close table — could not clear table signals:', e);
  }

  closeModal();

  if (failed) {
    // Leave the table on screen so nobody assumes it is settled.
    showToast(`⚠️ Closed ${ok}/${live.length} order(s). ${lastErr}`);
    updateBadges();
    renderTab();
    return;
  }

  clearTable(tableNum, branchId);
  if (live.length) showToast(`✅ Table ${tableNum} closed · ${live.length} order(s) completed.`);
}

let _floorDiscountTemplates = null;
async function _ensureFloorDiscountTemplates(force) {
  if (_floorDiscountTemplates && !force) return _floorDiscountTemplates;
  try {
    _floorDiscountTemplates = await TPN.listDiscountTemplates(true);
  } catch (e) { console.warn('load templates:', e); _floorDiscountTemplates = []; }
  return _floorDiscountTemplates;
}

async function openFloorDiscountPicker(orderDbIds, label, onDone) {
  if (!orderDbIds || !orderDbIds.length) { showToast('No active orders to apply discount to.'); return; }
  const templates = await _ensureFloorDiscountTemplates(false);
  const active    = (templates || []).filter(t => t.is_active);

  const applied = [];
  for (const id of orderDbIds) {
    try {
      const ad = await TPN.listAppliedDiscounts(id);
      ad.forEach(a => applied.push(Object.assign({}, a, { _orderId: id })));
    } catch(_){}
  }
  const canRemove = TPN.hasRole && TPN.hasRole('manager');

  const appliedRows = applied.length
    ? applied.map(a => `<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft,#eee);">
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;">${E(a.name_snapshot)}${a.legal_law?` <span style="font-size:10px;color:var(--text-muted);">(${E(a.legal_law)})</span>`:''}</div>
          <div style="font-size:11px;color:var(--text-muted);">−₱${Number(a.amount_applied).toFixed(2)}${a.id_ref?` · ID ${E(a.id_ref)}`:''}</div>
        </div>
        ${canRemove ? `<button class="topbar-btn secondary" onclick="removeFloorAppliedDiscount('${E(a.id)}', '${E(JSON.stringify(orderDbIds).replace(/'/g,'&#39;'))}', '${E(label)}')">Remove</button>` : ''}
      </div>`).join('')
    : `<div style="padding:12px;color:var(--text-muted);text-align:center;font-size:12px;">No discounts on this bill yet.</div>`;

  const templateRows = active.length
    ? active.map(t => {
        const valLabel = t.kind === 'percent' ? `${Number(t.value)}% off` : `−₱${Number(t.value).toFixed(2)}`;
        const vatBadge = t.kind === 'percent' && t.vat_treatment === 'net_of_vat' ? '<span style="font-size:11px;color:var(--text-muted);">🧾 Net of VAT</span>' : '';
        return `<button class="topbar-btn secondary" style="width:100%;text-align:left;padding:12px;margin-bottom:6px;display:flex;gap:10px;align-items:center;" onclick='applyFloorDiscount(${JSON.stringify(orderDbIds).replace(/'/g,"&#39;")}, "${E(t.id)}", ${t.requires_id?'true':'false'}, "${E((t.name||'').replace(/"/g,'\\"'))}", "${E(label)}")'>
          <span style="font-size:24px;">${E(t.icon||'💸')}</span>
          <span style="flex:1;">
            <span style="display:block;font-weight:600;">${E(t.name)} <span style="font-weight:400;color:var(--text-muted);font-size:12px;">${valLabel}</span></span>
            ${t.legal_law ? `<span style="font-size:11px;color:var(--brick);">🔒 ${E(t.legal_law)}</span> ` : ''}${vatBadge}
            ${t.description ? `<span style="display:block;font-size:11px;color:var(--text-muted);">${E(t.description)}</span>` : ''}
          </span>
        </button>`;
      }).join('')
    : '<div style="padding:12px;color:var(--text-muted);text-align:center;font-size:12px;">No active templates. Manager can create some in Discounts & Promos.</div>';

  openModal(`Discounts · ${label}`, `
    <div style="margin-bottom:10px;font-size:12px;color:var(--text-muted);">Will apply to ${orderDbIds.length} order${orderDbIds.length>1?'s':''} at this ${label.startsWith('Table')?'table':'bill'}.</div>
    <div style="font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.08em;margin:4px 0 6px;">APPLIED</div>
    ${appliedRows}
    <div style="font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.08em;margin:18px 0 6px;">ADD DISCOUNT</div>
    ${templateRows}
  `, [
    { label: 'Done', cls: 'primary', fn: `closeModal(); (${(onDone||function(){}).toString()})();` }
  ]);
}

async function applyFloorDiscount(orderDbIds, templateId, requiresId, tName, label) {
  let idRef = null;
  if (requiresId === true || requiresId === 'true') {
    idRef = window.prompt(`Enter the physical ID number for "${tName}" (min 3 chars):`, '');
    if (idRef === null) return;
    if (!idRef || idRef.trim().length < 3) { showToast('ID number is required (min 3 chars).'); return; }
    idRef = idRef.trim();
  }
  let ok = 0, fail = 0, lastErr = '';
  for (const id of orderDbIds) {
    try { await TPN.applyDiscount(id, templateId, idRef); ok++; }
    catch (e) { fail++; lastErr = (e && (e.message || e.code) || '').toString(); }
  }
  if (fail === 0) showToast(`✓ Discount applied to ${ok} order${ok>1?'s':''}`);
  else if (ok > 0) showToast(`⚠️ Applied to ${ok}, ${fail} failed (${_friendlyDiscountErr(lastErr)})`);
  else showToast(`⚠️ Discount failed: ${_friendlyDiscountErr(lastErr)}`);
  closeModal();
  openFloorDiscountPicker(orderDbIds, label, null);
}

async function removeFloorAppliedDiscount(appliedId, orderIdsJson, label) {
  const reason = window.prompt('Reason for removing this discount (optional):', '') || '';
  try { await TPN.removeDiscount(appliedId, reason.trim()); showToast('✓ Discount removed'); }
  catch (e) {
    const msg = _friendlyDiscountErr((e && (e.message || e.code) || '').toString());
    showToast(`⚠️ Remove failed: ${msg}`); return;
  }
  const ids = JSON.parse(orderIdsJson.replace(/&#39;/g,"'"));
  closeModal();
  openFloorDiscountPicker(ids, label, null);
}

function _friendlyDiscountErr(msg) {
  if (msg.includes('insufficient_privileges')) return 'You need supervisor+ to apply, manager+ to remove.';
  if (msg.includes('template_inactive')) return 'That template is turned off.';
  if (msg.includes('id_ref_required')) return 'This discount requires a physical ID.';
  if (msg.includes('order_terminal')) return 'Order already closed.';
  if (msg.includes('below_min_subtotal')) return 'Below the minimum subtotal.';
  if (msg.includes('not_stackable')) return 'Cannot combine with existing discounts.';
  return msg || 'unknown error';
}

async function toggleMenuItem(idx) {
  const item = menuAvailability[idx];
  if (!item) return;
  const newState = !item.available;
  // Optimistic update
  item.available = newState;
  renderTab();
  try {
    const { error } = await sb.from('menu_items').update({ is_available: newState }).eq('id', item.id);
    if (error) throw error;
    await TPN.logAudit('menu.toggle_availability', 'menu_item', item.id, { available: newState });
    showToast(`${item.name} marked as ${newState ? 'available' : 'unavailable'}.`);
  } catch(e) {
    console.error('toggleMenuItem:', e);
    item.available = !newState;   // rollback
    renderTab();
    showToast(`⚠️ Could not update ${item.name} — ${e.message||'try again'}`);
  }
}

// Load real menu from Supabase (mirrors what the customer-facing site sees)
async function loadMenuFromDB() {
  try {
    const { data, error } = await sb.from('menu_items')
      .select('id, name, emoji, price, is_available, pax_options, menu_categories(name)')
      .order('display_order', { ascending: true });
    if (error) throw error;
    menuAvailability = (data || []).map(i => ({
      id: i.id,
      name: i.name,
      emoji: i.emoji || '🍽️',
      available: i.is_available !== false,
      cat: i.menu_categories?.name || '—',
      price: i.pax_options
        ? `₱${Math.min(...Object.values(i.pax_options))}+`
        : `₱${Number(i.price)}`
    }));
    if (currentTab === 'menu') renderTab();
  } catch(e) { console.error('loadMenuFromDB:', e); }
}

function updateBranchTables(idx, val) {
  const n = parseInt(val);
  if (isNaN(n) || n < 1) return;
  branches[idx].tables = n;
  initTableStates();
  showToast(`${branches[idx].name} updated to ${n} tables.`);
  if (currentTab === 'floor') renderTab();
}

function toggleBranch(idx, active) {
  branches[idx].active = active;
  showToast(`${branches[idx].name} ${active ? 'enabled' : 'disabled'}.`);
}

function addBranch() {
  const name = document.getElementById('new-branch-name')?.value.trim();
  const tables = parseInt(document.getElementById('new-branch-tables')?.value) || 6;
  if (!name) { showToast('⚠️ Please enter a branch name.'); return; }
  const id = name.toLowerCase().replace(/\s+/g, '') + Date.now();
  branches.push({ id, name, tables, active: true });
  initTableStates();
  showToast(`✅ ${name} branch added with ${tables} tables.`);
  renderTab();
}

function openAddTableModal() {
  const branch = branches.find(b => b.name === currentBranch);
  if (!branch) return;
  openModal(`Add Tables — ${branch.name}`, `
    <p style="margin-bottom:14px;color:var(--text-muted)">Current tables: <strong>${branch.tables}</strong></p>
    <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Total number of tables</label>
    <input id="add-table-input" class="settings-input" type="number" min="1" max="50" value="${branch.tables}" style="width:100%;text-align:left">
  `, [
    { label: 'Cancel', cls: 'secondary', fn: 'closeModal()' },
    { label: 'Update Tables', cls: 'primary', fn: `updateBranchTables(${branches.indexOf(branch)}, document.getElementById('add-table-input').value); closeModal();` }
  ]);
}

// ─── TABLE MODAL ───
function openTableModal(tableNum, branchId) {
  const key = branchId + '_' + tableNum;
  const tbl = tableStates[key];
  if (!tbl || tbl.status === 'empty') return;
  const activeOrders = tbl.orders.filter(o => o.status !== 'done');

  let content = `
  <div style="display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap">
    <div style="flex:1;min-width:120px;background:var(--cream);border-radius:10px;padding:12px">
      <div style="font-size:11px;color:var(--text-muted);font-weight:700;margin-bottom:4px">GUEST</div>
      <div style="font-size:15px;font-weight:700">${tbl.guest}</div>
    </div>
    <div style="flex:1;min-width:120px;background:var(--cream);border-radius:10px;padding:12px">
      <div style="font-size:11px;color:var(--text-muted);font-weight:700;margin-bottom:4px">PAX</div>
      <div style="font-size:15px;font-weight:700">${tbl.pax} person(s)</div>
    </div>
    <div style="flex:1;min-width:120px;background:var(--cream);border-radius:10px;padding:12px">
      <div style="font-size:11px;color:var(--text-muted);font-weight:700;margin-bottom:4px">SESSION TOTAL</div>
      <div style="font-size:15px;font-weight:700;color:var(--brick)">₱${tbl.sessionTotal.toFixed(2)}</div>
    </div>
  </div>
  <div style="font-size:13px;font-weight:700;color:var(--text-muted);letter-spacing:0.07em;text-transform:uppercase;margin-bottom:10px">Orders (${activeOrders.length} active)</div>
  <div class="order-detail-items">`;

  tbl.orders.forEach(order => {
    const pillClass = { received: 'pill-received', preparing: 'pill-preparing', ready: 'pill-ready', done: 'pill-done' }[order.status];
    const pillLabel = { received: 'Received', preparing: 'Preparing', ready: 'Ready', done: 'Done' }[order.status];
    content += `<div style="background:var(--cream);border-radius:10px;padding:12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:12px;font-weight:600;color:var(--text-muted)">${order.ref}</span>
        <span class="order-status-pill ${pillClass}">${pillLabel}</span>
      </div>`;
    order.items.forEach(item => {
      content += `<div class="order-item-row" style="font-size:13px;padding:3px 0">
        <span>${E(item.emoji)} ${E(item.qty)}× ${E(item.name)}</span>
        <span style="font-weight:600;color:var(--text-muted)">₱${(item.price * item.qty).toFixed(2)}</span>
      </div>`;
    });
    if (order.allergies?.length) {
      order.allergies.forEach(a => { content += `<span class="order-flag flag-allergy" style="margin-top:6px;display:inline-block">⚠️ ${a}</span>`; });
    }
    if (order.specialReq) content += `<div style="margin-top:6px;font-size:12px;color:var(--amber)">📝 ${order.specialReq}</div>`;
    content += `</div>`;
  });
  content += `</div>`;

  const branchIdx = branches.findIndex(b => b.id === branchId);
  openModal(`Table ${tableNum} Details`, content, [
    { label: 'Close', cls: 'secondary', fn: 'closeModal()' },
    { label: tbl.billRequested ? '✓ Close Table' : '💳 Request Bill', cls: 'primary', fn: tbl.billRequested ? `clearTable(${tableNum}, '${branchId}'); closeModal();` : `markBillReady(${tableNum}, '${branchId}'); closeModal();` }
  ]);
}

// ─── ORDER MODAL ───
function openOrderModal(ref) {
  const order = dineInOrders.find(o => o.ref === ref);
  if (!order) return;
  const pipeline = ['received', 'preparing', 'ready', 'done'];
  const nextStatus = pipeline[pipeline.indexOf(order.status) + 1];

  let content = `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
    <div style="background:var(--cream);border-radius:10px;padding:10px"><div style="font-size:10px;color:var(--text-muted);font-weight:700">TABLE</div><div style="font-size:16px;font-weight:700">Table ${order.table}</div></div>
    <div style="background:var(--cream);border-radius:10px;padding:10px"><div style="font-size:10px;color:var(--text-muted);font-weight:700">GUEST</div><div style="font-size:16px;font-weight:700">${E(order.name)}</div></div>
    <div style="background:var(--cream);border-radius:10px;padding:10px"><div style="font-size:10px;color:var(--text-muted);font-weight:700">PAX</div><div style="font-size:16px;font-weight:700">${order.pax}</div></div>
    <div style="background:var(--cream);border-radius:10px;padding:10px"><div style="font-size:10px;color:var(--text-muted);font-weight:700">TOTAL</div><div style="font-size:16px;font-weight:700;color:var(--brick)">₱${order.total.toFixed(2)}</div></div>
  </div>
  <div style="font-size:13px;font-weight:700;color:var(--text-muted);letter-spacing:0.07em;text-transform:uppercase;margin-bottom:10px">Items</div>
  <div class="order-detail-items">`;
  order.items.forEach(item => {
    const waiting = item.id && _pendingVoidItemIds.has(item.id);
    // Everyone here files a REQUEST — including managers, so that every
    // void on the floor leaves the same paper trail. Approval happens in
    // the portal's Void Requests tab.
    const ask = (item.id && !item.voided)
      ? (waiting
          ? `<button class="detail-void-btn" disabled title="A manager has been notified">⏳</button>`
          // Only ids in the attribute — dish names carry apostrophes and
          // quotes; requestVoid() looks the name up from state.
          : `<button class="detail-void-btn" title="Ask a manager to void this line"
               onclick="requestVoid('${E(order.dbId)}','${E(item.id)}')">✕</button>`)
      : '';
    content += `<div class="detail-item" style="${item.voided ? 'opacity:0.5;' : ''}">
      <div class="detail-item-emoji">${item.emoji || '🍽️'}</div>
      <div class="detail-item-info">
        <div class="detail-item-name" style="${item.voided ? 'text-decoration:line-through;' : ''}">${E(item.name)}${item.variant ? ' — ' + E(item.variant) : ''}</div>
        <div class="detail-item-meta">Qty: ${item.qty} × ₱${item.price}${item.voided ? ' · voided' : ''}</div>
      </div>
      <div class="detail-item-price">₱${(item.price * item.qty).toFixed(2)}</div>
      ${ask}
    </div>`;
  });
  content += `</div>`;
  content += `<div style="margin-top:10px;font-size:11.5px;color:var(--text-muted);line-height:1.5;">
    ✕ asks a manager to void a line — it does not void it. Approve or deny in the staff portal under <strong>Void Requests</strong>.
  </div>`;
  if (order.allergies?.length) {
    content += `<div style="margin-top:12px"><div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px">ALLERGIES / DIETARY</div>`;
    order.allergies.forEach(a => { content += `<span class="order-flag flag-allergy" style="display:inline-block;margin:2px">⚠️ ${a}</span>`; });
    content += `</div>`;
  }
  if (order.specialReq) content += `<div style="margin-top:10px;background:var(--amber-light);border-radius:8px;padding:10px;font-size:13px;color:var(--amber)">📝 <strong>Special request:</strong> ${order.specialReq}</div>`;

  // A screen advances tickets but never closes them (see advanceOrder).
  const canAdvance = nextStatus && !(IS_DISPLAY_ACCOUNT && nextStatus === 'done');
  openModal(`Order ${order.ref}`, content, [
    { label: 'Close', cls: 'secondary', fn: 'closeModal()' },
    ...(canAdvance ? [{ label: `→ Mark as ${nextStatus.charAt(0).toUpperCase() + nextStatus.slice(1)}`, cls: 'primary', fn: `advanceOrder('${ref}'); closeModal();` }] : [])
  ]);
}

// ─── QR MODAL ───
function openQRModal(tableNum, branchName, url) {
  const fullUrl = window.location.origin + '/' + url;
  openModal(`Table ${tableNum} QR Code`, `
  <div class="qr-display">
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Customers scan this to view the menu and order.</div>
    <div class="qr-placeholder">📱</div>
    <div style="margin-bottom:10px;font-size:13px;font-weight:600">Table ${tableNum} — ${branchName}</div>
    <div class="qr-url">${url}?table=${tableNum}&branch=${encodeURIComponent(branchName)}</div>
    <div style="margin-top:12px;font-size:12px;color:var(--text-muted)">(QR code would be generated from this URL in production)</div>
  </div>
  <div style="display:flex;gap:10px;margin-top:10px">
    <a href="${url}?table=${tableNum}&branch=${encodeURIComponent(branchName)}" target="_blank" style="flex:1;text-align:center;padding:12px;background:var(--brick);color:#fff;border-radius:10px;font-weight:700;font-size:13px;text-decoration:none">Open Customer Menu</a>
  </div>
  `, [{ label: 'Close', cls: 'secondary', fn: 'closeModal()' }]);
}

// ─── STAT TILE DRILLDOWNS ───
function showRevenueModal(totalRev) {
  const branch = branches.find(b => b.name === currentBranch);
  if (!branch) return;
  // Build per-table breakdown
  let rows = '';
  let byType = { dinein: 0, takeout: 0 };
  for (let i = 1; i <= branch.tables; i++) {
    const key = branch.id + '_' + i;
    const tbl = tableStates[key];
    if (!tbl || tbl.status === 'empty' || tbl.sessionTotal === 0) continue;
    const orderCount = tbl.orders?.filter(o => o.status !== 'done').length || 0;
    byType.dinein += tbl.sessionTotal;
    rows += `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0e6d3;font-size:14px;">
      <div><span style="font-weight:700;color:#2d1a0a;">Table ${i}</span> <span style="color:#7a5c3a;font-size:12px;">· ${tbl.guest || '—'} · ${tbl.pax || 0} pax</span></div>
      <div style="text-align:right;"><div style="font-weight:700;color:#8B1A0E;">₱${(tbl.sessionTotal||0).toLocaleString('en',{minimumFractionDigits:2})}</div><div style="font-size:11px;color:#7a5c3a;">${orderCount} active order(s)</div></div>
    </div>`;
  }
  if (!rows) rows = `<div style="text-align:center;padding:30px;color:#7a5c3a;font-style:italic;">No occupied tables at this time.</div>`;

  const pct = (v) => totalRev ? ((v / totalRev) * 100).toFixed(0) + '%' : '0%';
  openModal('💰 Session Revenue', `
    <div style="background:#f5ead8;border-radius:10px;padding:16px;margin-bottom:16px;text-align:center;">
      <div style="font-size:11px;color:#7a5c3a;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px;">Total Session Revenue</div>
      <div style="font-family:'Playfair Display',serif;font-size:36px;font-weight:900;color:#8B1A0E;">₱${totalRev.toLocaleString('en',{minimumFractionDigits:2})}</div>
      <div style="font-size:12px;color:#7a5c3a;margin-top:4px;">${currentBranch} · current shift</div>
    </div>
    <div style="font-size:11px;font-weight:700;color:#7a5c3a;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;">Per Table</div>
    ${rows}
  `, [{ label: 'Close', cls: 'secondary', fn: 'document.getElementById("modal").classList.remove("open");document.body.style.overflow=""' }]);
}

function showOccupiedTablesList(branchId) {
  const branch = branches.find(b => b.id === branchId);
  if (!branch) return;
  let rows = '';
  for (let i = 1; i <= branch.tables; i++) {
    const key = branch.id + '_' + i;
    const tbl = tableStates[key];
    if (!tbl || tbl.status === 'empty') continue;
    const statusColors = { occupied: '#c8922a', 'active-orders': '#8B1A0E', ready: '#2d7a4f', 'bill-requested': '#1a4a7a' };
    const statusLabels = { occupied: 'Occupied', 'active-orders': 'Active Orders', ready: 'Food Ready', 'bill-requested': 'Bill Requested' };
    const elapsed = tbl.openedAt ? Math.floor((Date.now() - new Date(tbl.openedAt)) / 60000) + ' min' : '—';
    rows += `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0e6d3;cursor:pointer;" onclick="document.getElementById('modal').classList.remove('open');document.body.style.overflow='';openTableModal(${i},'${branchId}')">
      <div>
        <div style="font-weight:700;font-size:15px;color:#2d1a0a;">Table ${i}</div>
        <div style="font-size:12px;color:#7a5c3a;">${tbl.guest || '—'} · ${tbl.pax || 0} pax · ${elapsed}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:11px;font-weight:700;color:${statusColors[tbl.status] || '#9e9e9e'};margin-bottom:3px;">${statusLabels[tbl.status] || tbl.status}</div>
        <div style="font-weight:700;color:#8B1A0E;">₱${(tbl.sessionTotal||0).toLocaleString('en',{minimumFractionDigits:2})}</div>
      </div>
    </div>`;
  }
  if (!rows) rows = `<div style="text-align:center;padding:30px;color:#7a5c3a;font-style:italic;">No occupied tables right now.</div>`;
  openModal('🪑 Occupied Tables', rows,
    [{ label: 'Close', cls: 'secondary', fn: 'document.getElementById("modal").classList.remove("open");document.body.style.overflow=""' }]);
}

function showBillRequestedList(branchId) {
  const branch = branches.find(b => b.id === branchId);
  if (!branch) return;
  let rows = '';
  for (let i = 1; i <= branch.tables; i++) {
    const key = branch.id + '_' + i;
    const tbl = tableStates[key];
    if (!tbl || !tbl.billRequested) continue;
    rows += `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0e6d3;">
      <div>
        <div style="font-weight:700;font-size:15px;color:#2d1a0a;">Table ${i} <span style="font-size:12px;color:#1a4a7a;">💳 Bill Requested</span></div>
        <div style="font-size:12px;color:#7a5c3a;">${tbl.guest || '—'} · ${tbl.pax || 0} pax</div>
      </div>
      <div style="text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
        <div style="font-weight:700;color:#8B1A0E;font-size:16px;">₱${(tbl.sessionTotal||0).toLocaleString('en',{minimumFractionDigits:2})}</div>
        <button style="background:#8B1A0E;color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;" onclick="document.getElementById('modal').classList.remove('open');document.body.style.overflow='';closeTable(${i},'${branchId}')">Close Table</button>
      </div>
    </div>`;
  }
  if (!rows) rows = `<div style="text-align:center;padding:30px;color:#7a5c3a;font-style:italic;">No tables with pending bills.</div>`;
  openModal('💳 Bill Requested', rows,
    [{ label: 'Close', cls: 'secondary', fn: 'document.getElementById("modal").classList.remove("open");document.body.style.overflow=""' }]);
}


function openModal(title, content, buttons = []) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').innerHTML = content;
  document.getElementById('modal-footer').innerHTML = buttons.map(b =>
    `<button class="modal-btn ${b.cls}" onclick="${b.fn}">${b.label}</button>`
  ).join('');
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

// ─── TOAST ───
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}
</script>
