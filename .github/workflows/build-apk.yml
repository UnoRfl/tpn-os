# Builds the TPN Counter APK (android/). Pushing changes to this file needs a
# token with the "workflow" scope (UnoRfl's on the Mac; see HANDOFF.md Rev 24).
#
# Repo secrets (Settings → Secrets and variables → Actions), set by the owner:
#   TPN_KEYSTORE_B64       base64 of tpn-counter.p12 (the signing key)
#   TPN_KEYSTORE_PASSWORD  its password
# Without them the APK is debug-signed: fine to try, but every new build then
# needs the old app uninstalled first (and uninstalling wipes its storage).
name: Build TPN Counter APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Site the app opens (ends with /)
        default: https://unorfl.github.io/tpn-os/
  push:
    paths: ['android/**', '.github/workflows/build-apk.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Signing key
        env:
          KS_B64: ${{ secrets.TPN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/tpn-counter.p12"
            echo "TPN_KEYSTORE=$RUNNER_TEMP/tpn-counter.p12" >> "$GITHUB_ENV"
            echo "Release-signed"
          else
            echo "::warning::No TPN_KEYSTORE_B64 secret: building a debug-signed APK"
          fi
      - name: Build
        env:
          TPN_SITE_URL: ${{ inputs.site_url || 'https://unorfl.github.io/tpn-os/' }}
          TPN_VERSION_CODE: ${{ github.run_number }}
          TPN_KEYSTORE_PASSWORD: ${{ secrets.TPN_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/tpn-counter.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: tpn-counter-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
