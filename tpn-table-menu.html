  window.addEventListener('unhandledrejection', function(ev){ console.error('[Menu unhandled]', ev.reason); });
  window.E = function(v){
    if (v === null || v === undefined) return '';
    const M = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
    return String(v).replace(/[&<>"']/g, c => M[c]);
  };
  window.JA = function(v){
    // JS-string escape, then HTML escape: safe inside onclick="f('${JA(v)}')".
    return window.E(String(v == null ? '' : v).replace(/[\\'"<>\n\r\u2028\u2029]/g, function(c){ return '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'); }));
  };
  (function(){
    var p = window.location.pathname;

<script>
const urlParams = new URLSearchParams(window.location.search);
const TABLE_NUM = parseInt(urlParams.get('table')) || 1;
const BRANCH = urlParams.get('branch') || 'Las Piñas';
const BRANCH_ID = urlParams.get('branchId') || 'laspinas';
const SESSION_KEY = 'tpn_session_' + BRANCH_ID + '_t' + TABLE_NUM;
const ORDER_KEY_KEY = 'tpn_order_key_' + BRANCH_ID + '_t' + TABLE_NUM;
const CART_KEY = 'tpn_table_cart_' + BRANCH_ID + '_t' + TABLE_NUM;

/* ── language: same switch and same saved choice as the website ── */
let TPN_LANG = (function () { try { return localStorage.getItem('tpn.lang') || 'tl'; } catch (e) { return 'tl'; } })();
// Every string on this page in both languages. tpn-home.js adds its own
// (card labels, the engraved title) to this table on load.
const TPN_STRINGS = {
  'menu.unavailable':     { en: 'The menu can’t load right now.', tl: 'Hindi ma-load ang menu ngayon.' },
  'menu.unavailableBody': { en: 'It’s on our side, not your phone. Wave to any of our staff and they’ll take your order. We’ll keep trying too.', tl: 'Problema ito sa amin, hindi sa phone mo. Tawagin lang po ang aming staff at sila ang kukuha ng order. Susubukan din namin ulit.' },
  'menu.retry':           { en: 'Try again →', tl: 'Subukan ulit →' },
  table:       { en: 'Table {n}', tl: 'Mesa {n}' },

function T(key, vars) {

  if (vars) for (const v in vars) s = s.split('{' + v + '}').join(vars[v]);
  return s;
}

function setLang(l) {
  if (l !== 'en' && l !== 'tl') l = 'en';

  document.documentElement.lang = TPN_LANG;
  document.querySelectorAll('[data-s]').forEach(el => { el.textContent = T(el.dataset.s); });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', (b.getAttribute('onclick') || '').includes("'" + TPN_LANG + "'")));

/* ── table + branch ids (resolved once on load) ── */
let TABLE_UUID = null, BRANCH_UUID = null;
async function resolveTableIds() {
  try {
    const branch = await TPN.getBranchByCode(BRANCH_ID);
    if (!branch) { console.error('Branch not found:', BRANCH_ID); return; }
    BRANCH_UUID = branch.id;
    const table = await TPN.getTableByNumber(BRANCH_ID, TABLE_NUM);
    if (!table) { console.error('Table not found:', TABLE_NUM, 'at', BRANCH_ID); return; }
    TABLE_UUID = table.id;
  } catch(e) { console.error('resolveTableIds failed:', e); }
}
// A blip at load must not leave the table stuck on "not set up": look
// again when the guest taps Send / Bill / Call staff, or the line returns.
let tableIdsP = resolveTableIds();
async function tableReady() {
  if (TABLE_UUID && BRANCH_UUID) return true;
  tableIdsP = tableIdsP.then(() => (TABLE_UUID && BRANCH_UUID) ? null : resolveTableIds());
  await tableIdsP;
  return !!(TABLE_UUID && BRANCH_UUID);
}
window.addEventListener('online', () => { tableReady(); });

let menuData = [], menuLoadState = 'loading', activeCategory = 'all';
function withDeadline(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
}
let _menuBgRetry = null;
async function loadMenuFromDB(attempt = 1) {
  if (menuLoadState !== 'ok') menuLoadState = 'loading';
  if (attempt === 1 && !menuData.length) renderMenu();
  try {
    if (!window.TPN || typeof TPN.loadGroupedMenu !== 'function') throw new Error('Menu library not ready — retrying');
    let fresh = await withDeadline(TPN.loadGroupedMenu(BRANCH_ID), 5000);
    // An empty menu can also mean the branch filter is too strict: try once without it.
    if ((!Array.isArray(fresh) || !fresh.length) && attempt === 1) fresh = await withDeadline(TPN.loadGroupedMenu(null), 5000);
    menuData = Array.isArray(fresh) ? fresh : [];
    menuLoadState = 'ok';
    clearInterval(_menuBgRetry); _menuBgRetry = null;
    renderMenu();
    loadReturningGuest();
  } catch (e) {
    console.error('loadMenuFromDB attempt', attempt, e);
    // Three tries, ~16s worst case, before the guest is told what to do.
    if (attempt < 3) {
      setTimeout(() => loadMenuFromDB(attempt + 1), Math.min(500 * Math.pow(2, attempt - 1), 4000));
    } else {
      if (!menuData.length) { menuLoadState = 'error'; renderMenu(); }
      // Keep trying quietly so the menu appears by itself once the connection is back.
      if (!_menuBgRetry) _menuBgRetry = setInterval(() => { if (menuLoadState === 'error') loadMenuFromDB(3); }, 20000);
    }
  }
}
function retryMenuLoad() { menuLoadState = 'loading'; renderMenu(); loadMenuFromDB(1); }
window.addEventListener('online', () => { if (menuLoadState === 'error') loadMenuFromDB(3); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && menuLoadState === 'error') loadMenuFromDB(3); });

function renderCategoryChips() {
  const all = TPN_LANG === 'tl' ? 'Lahat' : 'All';
  const cats = [{ cat: 'all', catName: all }].concat(menuData.filter(c => c.items.length));
  document.getElementById('catChips').innerHTML = cats.map(c =>
    `<button class="chip ${c.cat === activeCategory ? 'active' : ''}" onclick="setCategory('${JA(c.cat)}')">${E(TPN_LANG === 'tl' && c.catNameTl ? c.catNameTl : c.catName)}</button>`).join('');
}
function setCategory(c) { activeCategory = c; renderMenu(); }
// The website's own card (tpn-home.js), so a dish looks the same here and
// there. Sold-out dishes stay visible, dimmed, with no add button.
function soldOutCard(html) {
  return html.replace('v3-card v3-reveal', 'v3-card off v3-reveal')
    .replace(/<button class="v3-add"[\s\S]*?<\/button>/g, `<span class="tm-soldout">${E(T('soldOut'))}</span>`);
}
function renderMenu() {
  renderCategoryChips();
  const sec = document.getElementById('menuSection');
  if (!window.tpnHome) return;
  if (!menuData.length) {
    sec.innerHTML = menuLoadState === 'error'
      ? `<div class="empty-state" role="alert"><div class="empty-state-icon">📶</div>
          <div class="empty-state-title">${E(T('menu.unavailable'))}</div>
          <div class="empty-state-body">${E(T('menu.unavailableBody'))}</div>
          <button class="empty-state-cta" onclick="retryMenuLoad()">${E(T('menu.retry'))}</button></div>`
      : `<div class="v3-grid" aria-busy="true" aria-label="${E(T('loading'))}">${'<div class="tm-skel"></div>'.repeat(6)}</div>`;
    return;
  }
  const raw = (document.getElementById('menuSearch').value || '').trim(), q = raw.toLowerCase();
  let html = '';
  menuData.forEach(cat => {
    if (activeCategory !== 'all' && activeCategory !== cat.cat) return;
    const items = cat.items.filter(it => !q || (it.name + ' ' + (it.nameTl || '') + ' ' + (it.desc || '')).toLowerCase().includes(q));
    if (!items.length) return;
    // available dishes first; sold-out ones sink to the bottom of their group
    items.sort((a, b) => (b.available ? 1 : 0) - (a.available ? 1 : 0));
    const title = TPN_LANG === 'tl' && cat.catNameTl ? cat.catNameTl : cat.catName;
    html += `<div class="v3-cat"><h3>${E(title)}<small>${E(T('v3.count', { n: items.length }))}</small></h3>
      <div class="v3-grid">${items.map(it => { const c = tpnHome.card(it, cat.catName); return it.available ? c : soldOutCard(c); }).join('')}</div></div>`;
  });
  if (!html) { sec.innerHTML = tpnHome.emptySearch(raw); return; }
  sec.innerHTML = html;
  tpnHome.afterRender(sec);
}
function findDish(id) { for (const c of menuData) { const it = c.items.find(i => i.id === id); if (it) return it; } return null; }

/* ── returning guest (my_guest_profile returns null on a first visit) ── */
async function loadReturningGuest() {
  try {
    if (!window.TPN || typeof TPN.getMyGuestProfile !== 'function') return;
    const g = loadReturningGuest._g || (loadReturningGuest._g = await TPN.getMyGuestProfile());
    if (!g || !g.is_returning) return;
    const first = g.name ? String(g.name).split(' ')[0] : '';
    const ord = n => { n = Number(n) || 0; if (TPN_LANG === 'tl') return n; const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
    const usuals = (g.usuals || []).slice(0, 3).map(u => { for (const c of menuData) { const it = c.items.find(i => i.name === u.name && i.available); if (it) return it; } return null; }).filter(Boolean);
    const box = document.getElementById('tmWelcome');
    box.innerHTML = `<div class="v3-shell"><div class="v3-core">
      <b>${E(T('welcome', { name: first ? ', ' + first : '' }))}</b>
      <span>${E(T('welcomeSub', { n: ord(g.order_count) }))}</span>
      ${usuals.length ? `<div class="usuals"><span style="align-self:center">${E(T('usual'))}</span>${usuals.map(it =>
        `<button class="chip" onclick="quickAdd('${JA(it.id)}')">+ ${E(dishName(it))}</button>`).join('')}</div>` : ''}
    </div></div>`;
    box.hidden = false;
    if (g.name && !guestName) guestName = g.name;    // saves a regular retyping their name
  } catch (e) { /* never block the menu on a nicety */ }
}

let _mods = null;
async function loadMods() { if (_mods) return _mods; try { _mods = await TPN.loadModifiers(); } catch (e) { _mods = { groups: [], byItem: {} }; } return _mods; }
loadMods();
const groupsFor = id => (_mods && _mods.byItem[id]) || [];

/* Called by the card's + button (tpn-home.js). A dish with choices opens the
   options sheet; everything else goes straight onto the tray in one tap. */
function addToCart(id, sizeKey) {
  const it = findDish(id);
  if (!it || !it.available) { toast(T('soldOut')); return; }
  if (groupsFor(id).length) { openSheet(it, sizeKey); return; }
  putOnTray(it, sizeKey, [], 1);
}
function priceOf(it, sizeKey) { return sizeKey === 'single' || !it.pricePax ? Number(it.price) : Number(it.pricePax[sizeKey]); }
function putOnTray(it, sizeKey, mods, qty) {
  const opts = groupsFor(it.id).flatMap(g => g.options);
  const chosen = mods.map(m => opts.find(o => o.id === m)).filter(Boolean);
  const price = priceOf(it, sizeKey) + chosen.reduce((a, o) => a + Number(o.price_delta || 0), 0);
  const cartKey = [it.id, sizeKey, mods.slice().sort().join(',')].join('|');
  const ex = cart.find(c => c.cartKey === cartKey);
  if (ex) ex.qty += qty;
  else cart.push({ cartKey, id: it.id, name: it.name, nameTl: it.nameTl, emoji: it.emoji, sizeKey, price, qty, mods: mods.slice(), modNames: chosen.map(o => o.name) });
  persistCart(); updateCartUI(true);
  toast(T('added', { name: dishName(it) }));
}

let sheet = null;
function openSheet(it, sizeKey) {
  sheet = { it, sizeKey, mods: [], qty: 1 };
  renderSheet();
  document.getElementById('sheetBg').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet() {
  document.getElementById('sheetBg').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
function renderSheet() {
  const { it, sizeKey, mods, qty } = sheet;
  const groups = groupsFor(it.id);
  const opts = groups.flatMap(g => g.options);
  const unit = priceOf(it, sizeKey) + mods.reduce((a, id) => a + Number((opts.find(o => o.id === id) || {}).price_delta || 0), 0);

async function submitOrder() {
  saveReviewFields();
  const name = guestName.trim(), pax = guestPax;
  if (!name) { toast(T('needName')); document.getElementById('tmName')?.focus(); return; }
  if (!cart.length) return;
  if (!(await tableReady())) { toast(T('noTable')); return; }
  // Guard against a double-tap firing two orders; re-enabled on failure.
  const btn = document.getElementById('tmSend');
  if (btn.dataset.busy === '1') return;
  btn.dataset.busy = '1'; btn.disabled = true; btn.textContent = T('sending');
  const notes = roundNotes.trim(), total = roundTotal();
  try {
    // submit_order() appends to the bill already open on this table, so
    // several phones at one table end up on one bill. The server prices
    // every line itself; the prices here are only for display.
    const items = cart.map(c => ({
      menu_item_id: c.id, name: c.name + (c.modNames && c.modNames.length ? ' (' + c.modNames.join(', ') + ')' : ''),
      unit_price: c.price, quantity: c.qty,
      pax_size: c.sizeKey && c.sizeKey !== 'single' ? c.sizeKey : null,
      modifiers: c.mods && c.mods.length ? c.mods : undefined, notes: null
    }));
    // One key per round (sql/41), kept in this tab before sending: if the
    // reply is lost after the kitchen got the round, sending again (even
    // after a refresh) adds nothing to the table bill.
    let prevKey = null;
    try { prevKey = JSON.parse(sessionStorage.getItem(ORDER_KEY_KEY) || 'null'); } catch (e) {}
    const orderKey = TPN.orderKey(prevKey, JSON.stringify([name, notes, items.map(i => [i.menu_item_id, i.quantity, i.pax_size, i.modifiers || []])]));
    try { sessionStorage.setItem(ORDER_KEY_KEY, JSON.stringify(orderKey)); } catch (e) {}
    const res = await TPN.createOrder({ clientKey: orderKey.key, branchId: BRANCH_UUID, tableId: TABLE_UUID, orderType: 'dine_in', customerName: name, notes: notes || null, items });
    try { sessionStorage.removeItem(ORDER_KEY_KEY); } catch (e) {}   // sent: the next round gets a new key

    const order = { id: res.order_number, dbId: res.id, table: TABLE_NUM, branch: BRANCH, branchId: BRANCH_ID, name, pax, specialReq: notes,
      items: JSON.parse(JSON.stringify(cart)), total, timestamp: new Date().toISOString(), status: 'received', type: 'dine-in',
      tableTotal: Number(res.total) || total, joined: !!res.joined_existing };
    sessionOrders.push(order); sessionTotal += total; saveSessionOrders();
    billSent = null; saveBillSent();      // a new round changes the bill: the old request no longer applies
    cart = []; roundNotes = ''; persistCart(); updateCartUI(); updateDock();
    shownOrder = order; freshPrint = true;
    go('sent', true);
    subscribeToOrderProgress(order);
    if (res.joined_existing) setTimeout(() => toast(T('joined', { p: peso(res.total) })), 2600);
  } catch (e) {
    console.error('Order submission failed:', e);
    toast(e && e.message && !/fetch|network|timeout/i.test(e.message) ? e.message : T('sendFail'));
    btn.dataset.busy = '0'; btn.disabled = false; btn.textContent = T('send');
  }
}

function setOrderProgress(order, state) {
  if (shownOrder !== order || view !== 'sent') return;

  el.style.setProperty('--p', idx / 3);

// Map the DB order status enum → the 4 customer-facing progress states.
function dbStatusToProgress(s) {
  return ({ pending: 'received', confirmed: 'received', preparing: 'preparing', ready: 'ready', served: 'served', completed: 'served', cancelled: 'served' })[s] || 'received';
}
const _orderSubscriptions = new Map();   // dbId -> unsubscribe fn
const _notifiedReady = new Set();
function subscribeToOrderProgress(order) {
  if (!order || !order.dbId || _orderSubscriptions.has(order.dbId)) return;
  // Keyed on order_number: the customer watcher polls track_order(). A guest
  // has no SELECT on orders, so a realtime subscription would never fire.
  const unsub = TPN.subscribeToOrder(order.id, (payload) => {
    const st = payload && payload.new && payload.new.status;
    if (!st) return;
    const ui = dbStatusToProgress(st);
    const local = sessionOrders.find(o => o.dbId === order.dbId);
    if (local) { local.status = ui; saveSessionOrders(); }
    setOrderProgress(local || order, ui);
    if (ui === 'ready' && !_notifiedReady.has(order.dbId)) { _notifiedReady.add(order.dbId); toast('🔔 ' + T('readyToast')); }
    if (['served', 'completed', 'cancelled'].includes(st)) {
      const u = _orderSubscriptions.get(order.dbId); if (typeof u === 'function') u();
      _orderSubscriptions.delete(order.dbId);
    }
  });
  _orderSubscriptions.set(order.dbId, unsub);
}
function resubscribeStoredOrders() {
  sessionOrders.forEach(o => { if (o.dbId && !['served', 'completed', 'cancelled'].includes(o.status)) subscribeToOrderProgress(o); });
}

async function submitBillRequest() {
  const btn = document.getElementById('tmAskBill');
  if (btn) btn.disabled = true;
  if (billMethod === 'online') {
    // The latest order on this phone carries the table bill's tracking
    // token (the bill is shared). HitPay's webhook marks it paid.
    const last = sessionOrders[sessionOrders.length - 1];
    try {
      const pay = await TPN.startOnlinePayment({ orderNumber: last.id, returnPath: 'table', returnQuery: location.search.slice(1) });
      if (pay && /^https:\/\//.test(pay.checkout_url)) { location.href = pay.checkout_url; return; }
    } catch (e) { toast(T('onlineFail')); }
    billMethod = 'cash';
  }
  const ok = await notifyBillRequest(billMethod);
  if (btn) btn.disabled = false;
  if (ok === null) return;      // failed: stay here so they can try again
  billSent = { method: billMethod, at: Date.now(), total: sessionTotal };
  saveBillSent(); updateDock();
  renderBillSent(false);
  window.scrollTo({ top: 0, behavior: 'instant' });
}
// true = sent, false = already asked recently (still fine), null = failed

    const { data, error } = await sb.rpc('signal_bill_request', { p_table_id: TABLE_UUID, p_payment_method: method, p_total: sessionTotal });
    if (error) throw error;
    if (data === false) toast(T('billAgain'));
    return data !== false;
  } catch (e) {
    console.error('bill request failed:', e);
    toast(T('billFail'));
    return null;
  }
}

    <h2 class="confirm-title">${T('billSentTitle')}</h2>
    <div class="tm-wait" role="status"><span class="dot" aria-hidden="true"></span>${E(T('waitPill', { n: TABLE_NUM, how: T('how_' + m), p: total }))}</div>
    <div class="form-label tm-next-lbl">${E(T('whatNext'))}</div>
    <ol class="v3-steps tm-steps">${[1, 2, 3].map(i =>
      `<li><span class="n">${i}</span><p>${T('s_' + m + '_' + i, { p: E(total) })}</p></li>`).join('')}</ol>
    <p class="tm-mind">${E(T('changeMind'))}</p>
    <div class="rcpt-printer">
      <div class="rcpt-head" aria-hidden="true"><span class="rcpt-led"></span></div>
      <div class="rcpt-clip"><div class="rcpt-feed"><div class="rcpt" role="group" aria-label="${E(T('bill'))}">
        <div class="rcpt-brand" translate="no">Tyo Paeng Nyo</div>
        <div class="rcpt-row"><span>${E(T('bill'))}</span><b>${E(T('table', { n: TABLE_NUM }))}</b></div>
        <div class="rcpt-row"><span>${E(T('name'))}</span><span>${E(guestName)}</span></div>
        <div class="rcpt-row"><span>${E(T('payment'))}</span><span>${E(payName)}</span></div>
        <hr>
        ${sessionOrders.map((o, i) => `<div class="rcpt-item"><span>${i + 1}.</span><span>${E(o.id)}<small>${E(T('items', { n: o.items.reduce((s, c) => s + c.qty, 0) }))}</small></span><span class="a">${peso(o.total)}</span></div>`).join('')}
        <hr>
        <div class="rcpt-row rcpt-total"><span>${E(T('total'))}</span><span>${total}</span></div>
      </div></div></div>
    </div>
    <div class="confirm-after">
      <div class="tm-actions-col">
        <button class="btn-next" onclick="go('menu')">${E(T('backMenu'))}</button>
        <button class="tm-link" onclick="callStaff()">${E(T('callStaff'))}</button>
      </div>
    </div>`;
}

async function callStaff() {
  if (!(await tableReady())) { toast(T('noTable')); return; }
  try {
    // signal_call_staff returns FALSE inside its 90-second cooldown.
    const { data, error } = await sb.rpc('signal_call_staff', { p_table_id: TABLE_UUID });
    if (error) throw error;
    toast(data === false ? '⏳ ' + T('calledAgain') : '🤚 ' + T('called'));
  } catch (e) { console.error('callStaff failed:', e); toast(T('callFail')); }
}

// Online payment and card show only once the owner has turned them on.
(async function () {
  try {
    const { data } = await sb.from('site_settings').select('key,value').in('key', ['payments.online_enabled', 'payments.card_enabled']);
    const on = k => { const r = (data || []).find(x => x.key === k); const v = r && r.value; return v === true || v === 'true' || v === 'yes'; };
    onlinePay = on('payments.online_enabled');
    // Card needs a terminal (a bank merchant account), so it stays hidden
    // until the owner sets payments.card_enabled.
    cardPay = on('payments.card_enabled');
    if ((onlinePay || cardPay) && view === 'bill' && !billSent) renderBill();
  } catch (e) { /* stays cash / QR */ }
})();
// Back from HitPay: wait for the webhook, then say so honestly.
(async function () {
  const paid = urlParams.get('paid');
  if (!paid || !/^[A-Za-z0-9-]{4,64}$/.test(paid)) return;
  toast(T('payConfirm'));
  for (let i = 0; i < 40; i++) {
    try { const o = await TPN.getOrderByNumber(paid); if (o && o.payment_status === 'paid') { toast('✅ ' + T('payDone')); return; } } catch (e) {}
    await new Promise(r => setTimeout(r, 3000));
  }
  toast(T('payWait'));
})();

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

document.addEventListener('DOMContentLoaded', () => {
  applyStatic();
  updateCartUI(); updateDock();
  try { history.replaceState({ tm: 'menu' }, '', location.pathname + location.search); } catch (e) {}
  renderMenu();
  loadMenuFromDB();
  resubscribeStoredOrders();
});
</script>
